<!doctype html>
<html lang="tr" class="kabuk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BEYIN_AD}}</title>
<link rel="manifest" href="/uygulama/manifest.webmanifest">
<link rel="icon" href="/uygulama/ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/uygulama/ikon-180.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="{{BEYIN_AD}}">
<link rel="stylesheet" href="/project/tema.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Üstte açılanlar tek kart dili (K-072): ⌘K, + Veri, Kimlik, ⋯, model, doğrulama ve Bilgi menüsü aynı köşe, gölge ve ince kenarla */
:root{--kat-kose:12px;--kat-golge:0 18px 50px -24px rgba(55,53,47,.45)}
/* Kabuk: çalışma alanları (izole), ortak beyin (izole değil), her yerden veri ekleme. Renkler panolar/tema.css'ten. */
*{box-sizing:border-box}
[hidden]{display:none!important}
/* Basma hissi (K-037): her düğme basınca hafifçe çöker; ana düğmeler kabarık durur */
button{transition:transform 90ms ease,box-shadow 90ms ease,background-color .12s,border-color .12s,color .12s}
button:not(:disabled):active{transform:translateY(.5px) scale(.97)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--zemin);color:var(--yazi);font:14px/1.5 Geist,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
/* Görünüş (Ayarlar › Görünüş): koyu tema, vurgu rengi, yazı boyutu, sıklık, kenar listesi, hareketler */
.kabuk[data-tema="koyu"]{--zemin:#191919;--yan:#202020;--yan-2:#2A2A2A;--yan-3:#333333;--kart:#252525;--kart-2:#202020;--kod:#2A2A2A;--secili:#1F2A3D;
 --kenar:#2F2F2F;--kenar-2:#383838;--kenar-3:#4B4B4B;--nokta:#3A3A3A;--yazi:#E6E6E4;--yazi-2:#C9C9C6;--soluk:#9B9B98;--soluk-2:#6F6F6C;--ters:#E6E6E4;--ters-yazi:#191919;
 --notr-zemin:#2A2A2A;--karar:#6B9BF2;--karar-zemin:#1E2A44;--soru-zemin:#3A2E17;--ilke-zemin:#16322A;--kaynak-zemin:#2A2347;--yol:#6B9BF2;
 --r-gri-z:#2F2F2F;--r-kahve-z:#3A2D27;--r-turuncu-z:#3D2A18;--r-sari-z:#3A3219;--r-yesil-z:#1F3127;--r-mavi-z:#182E3A;--r-mor-z:#2D2338;--r-pembe-z:#3A2130;--r-kirmizi-z:#3D1F1F;color-scheme:dark}
.kabuk[data-vurgu="yesil"]{--karar:var(--r-yesil);--karar-zemin:var(--r-yesil-z);--yol:var(--r-yesil)}
.kabuk[data-vurgu="mor"]{--karar:var(--r-mor);--karar-zemin:var(--r-mor-z);--yol:var(--r-mor)}
.kabuk[data-vurgu="turuncu"]{--karar:var(--r-turuncu);--karar-zemin:var(--r-turuncu-z);--yol:var(--r-turuncu)}
.kabuk[data-vurgu="pembe"]{--karar:var(--r-pembe);--karar-zemin:var(--r-pembe-z);--yol:var(--r-pembe)}
.kabuk[data-vurgu="gri"]{--karar:var(--r-gri);--karar-zemin:var(--r-gri-z);--yol:var(--r-gri)}
[data-yazi="kucuk"] body:not(.cizimde):not(.ortakta) #icerik{zoom:.92}
[data-yazi="buyuk"] body:not(.cizimde):not(.ortakta) #icerik{zoom:1.1}
[data-siklik="siki"] .agac-git{height:26px;font-size:13.5px}[data-siklik="siki"] .sayfa{padding-top:40px}[data-siklik="siki"] .ray-kare{margin-bottom:-4px}
[data-liste="sabit"] .liste-yan{opacity:1!important;visibility:visible!important;transform:none!important;box-shadow:none}
[data-liste="sabit"] #ana{left:276px}
[data-hareket="kapali"] *,[data-hareket="kapali"] *::before,[data-hareket="kapali"] *::after{animation-duration:0s!important;animation-iteration-count:1!important;transition-duration:0s!important}
[data-zemin="duz"] .ob{background-image:none}
[data-zemin="izgara"] .ob{background-image:linear-gradient(var(--kenar) 1px,transparent 1px),linear-gradient(90deg,var(--kenar) 1px,transparent 1px)}
.gr-duzen{display:flex;gap:48px;align-items:flex-start}
.gr-liste{flex:1;min-width:0}
.gr-satir{display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;border-bottom:1px solid var(--kenar);font-size:14px}
.gr-renkler{display:flex;gap:8px}
.gr-renkler button{width:22px;height:22px;border-radius:99px;border:0;padding:0;background:var(--r);cursor:pointer}
.gr-renkler button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--kart),0 0 0 4px var(--r)}
.ent-izgara{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}@media (max-width:980px){.ent-izgara{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:640px){.ent-izgara{grid-template-columns:1fr}}
.ent-kart{display:flex;flex-direction:column;gap:12px;min-height:200px;padding:18px;border-radius:12px;background:var(--kart);box-shadow:0 0 0 1px var(--kenar),0 24px 60px -36px rgba(55,53,47,.45)}
.ent-bos{display:grid;place-items:center;min-height:200px;border-radius:12px;border:1.5px dashed var(--kenar-3);font-size:14px;color:var(--soluk)}
.ent-logo{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--yan);flex:none}
.ent-bas{display:flex;align-items:center;gap:10px}.ent-bas b{font-size:16px}.ent-durum{display:inline-flex;align-items:center;gap:7px;font-size:13px}.ent-alt{margin-top:auto}
.ent-nokta{width:8px;height:8px;border-radius:99px;flex:none;background:var(--r-gri)}.ent-nokta.bagli{background:var(--r-yesil)}.ent-nokta.yarim{background:var(--r-turuncu)}.ent-nokta.uyari{background:var(--r-kirmizi)}
.ent-acik{margin:0;font-size:13px;line-height:1.5;color:var(--soluk)}.ent-ayr{display:block;margin-top:6px;font:500 11.5px 'Geist Mono',monospace;color:var(--soluk-2);overflow-wrap:anywhere}
.ent-dugme{height:30px;padding:0 12px;border-radius:8px;border:0;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap;background:none;box-shadow:inset 0 0 0 1px var(--kenar-2);color:var(--yazi-2)}
.ent-dugme.ana{background:var(--yazi);color:var(--kart);box-shadow:none}.ent-dugme:disabled{opacity:.5;cursor:default}
.ent-form{display:flex;gap:8px;align-items:center;margin-top:10px}.ent-form .cm-girdi{margin:0;min-width:0;flex:1}
.ent-pre{margin:10px 0 0;padding:10px;border-radius:8px;background:var(--yan);font:500 11.5px/1.5 'Geist Mono',monospace;white-space:pre-wrap;max-height:220px;overflow:auto}
.ya-ipucu{font-size:13.5px;color:var(--soluk);margin:0 0 8px}
.surum-hak{font-size:12px;color:var(--soluk)}.surum-hak a{color:inherit}  /* lisans 1(b): ad, logo ve telif arayüzde kalır */
.ya-ca{border-bottom:1px solid var(--kenar)}.ya-ca.suruklenen,.ya-alan.suruklenen{position:relative;z-index:5;background:var(--kart);box-shadow:0 10px 26px -12px rgba(55,53,47,.45),0 0 0 1px var(--kenar);border-radius:8px}
.ya-satir{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 6px}
.ya-satir b{font-size:15px;font-weight:500;min-width:110px}.ya-satir small{font-size:13px;color:var(--soluk);min-width:56px}
.ya-tut{color:var(--soluk-2);cursor:grab;user-select:none;font-size:12px;letter-spacing:-2px;padding:4px 2px;touch-action:none}
.ya-ik{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:600}
.ya-izole{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font:inherit;font-size:13px;color:var(--soluk)}.ya-izole .anahtar{margin:0}
.ya-eylem{margin-left:auto;display:flex;gap:4px}.ya-eylem button{border:0;background:none;cursor:pointer;font:inherit;font-size:13px;color:var(--soluk);padding:5px 7px;border-radius:6px}
.ya-eylem button:hover{background:var(--yan-2);color:var(--yazi)}.ya-eylem button.sil{color:var(--tehlike)}
.ya-ac{border:0;background:none;cursor:pointer;color:var(--soluk);width:28px;height:28px;border-radius:6px;display:grid;place-items:center}.ya-ac svg{width:13px;height:13px;transition:transform .15s}
.ya-ac[aria-expanded="true"] svg{transform:rotate(90deg)}.ya-ac:hover{background:var(--yan-2)}
.ya-alanlar{padding:0 0 10px 34px}.ya-alan{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 6px}
.ya-git{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font:inherit;font-size:14px;color:var(--yazi-2);padding:0}.ya-git:hover{color:var(--yazi)}
.ya-alan .ya-eylem{opacity:0}.ya-alan:hover .ya-eylem{opacity:1}.ya-bos{display:block;padding:8px 6px;color:var(--soluk)}
.ya-yeni{margin-top:14px;border:0;background:none;cursor:pointer;font:inherit;font-size:14px;color:var(--soluk);padding:6px}.ya-yeni:hover{color:var(--yazi)}
.gr-anahtar{border:0;background:none;padding:4px;cursor:pointer;display:flex}
.gr-oniz{width:380px;flex:none;position:sticky;top:24px;display:flex;flex-direction:column;gap:8px}
.gr-oniz small{font-size:12px;color:var(--soluk)}
.gr-baslik{font-size:11.5px;font-weight:600;color:var(--soluk-2);letter-spacing:.03em}
.gr-pencere{height:250px;border-radius:12px;border:1px solid var(--kenar);overflow:hidden;display:flex;background:var(--kart)}
.gr-ray{width:34px;background:var(--yan);border-right:1px solid var(--kenar);display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:10px}
.gr-ray i{width:18px;height:18px;border-radius:5px;background:var(--r-yesil-z);box-shadow:0 0 0 1.5px var(--r-yesil)}.gr-ray i:nth-child(2){background:var(--r-mavi-z);box-shadow:0 0 0 1.5px var(--r-mavi)}.gr-ray i:nth-child(3){background:var(--r-mor-z);box-shadow:0 0 0 1.5px var(--r-mor)}
.gr-tuval{flex:1;position:relative;background-color:var(--yan);background-image:radial-gradient(var(--kenar-3) 1px,transparent 1px);background-size:14px 14px}
[data-zemin="duz"] .gr-tuval{background-image:none}
[data-zemin="izgara"] .gr-tuval{background-image:linear-gradient(var(--kenar) 1px,transparent 1px),linear-gradient(90deg,var(--kenar) 1px,transparent 1px)}
.gr-cubuk{position:absolute;left:10px;top:10px;height:22px;width:170px;border-radius:7px;background:var(--kart);box-shadow:0 0 0 1px var(--kenar)}
.gr-kart{position:absolute;left:60px;top:50px;width:200px;height:180px;border-radius:9px;background:var(--kart);box-shadow:0 10px 30px -18px rgba(55,53,47,.5);padding:14px;display:flex;flex-direction:column;gap:8px}
[data-yazi="kucuk"] .gr-kart b{font-size:13px}[data-yazi="buyuk"] .gr-kart b{font-size:18px}.gr-kart b{font-size:15px}
.gr-kart i{height:6px;border-radius:3px;background:var(--yan-2);width:90%}.gr-kart i+i{width:70%}
.gr-kart span{margin-top:auto;height:20px;width:90px;border-radius:99px;background:var(--karar)}
/* Kaydırma çubuğu: ince, izsiz; yalnız üstüne gelince belirir (Notion gibi) */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;border-radius:99px;background-clip:padding-box}
:hover::-webkit-scrollbar-thumb{background-color:var(--kenar-2)}
::-webkit-scrollbar-thumb:hover,::-webkit-scrollbar-thumb:active{background-color:var(--kenar-3)}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--kenar-2) transparent}}
a{color:var(--yol);text-decoration:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
/* Kenar çubuğu, Notion gibi: tek satırlı öğeler, kutusuz ikon, bölüm başlığındaki + yalnız üstüne gelince */
#yan{position:fixed;z-index:30;left:0;top:0;bottom:0;background:var(--yan);border-right:1px solid var(--kenar);display:flex}
/* Ray ve liste (K-038 adım 4): solda çalışma alanlarının renkli rayı, yanında yalnız seçili olanın alanları */
.ray{width:56px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 14px;border-right:1px solid var(--kenar);background:var(--yan-2);overflow:auto}
.ray-liste{display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0}
.ray-kare{position:relative;width:36px;height:36px;flex-shrink:0;border:0;border-radius:10px;background:none;cursor:pointer;display:grid;place-items:center;color:var(--soluk);font-size:17px;line-height:1}
.ray-kare:hover{background:var(--yan-3);color:var(--yazi)}
.ray-kare svg{width:18px;height:18px}
.ray-kare.yeni-surum::after{content:'';position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--r-mavi);box-shadow:0 0 0 1.5px var(--yan-2)}
.ray-kare[aria-current="true"]{background:var(--kart);color:var(--yazi);box-shadow:0 1px 3px rgba(55,53,47,.14)}
.ray-kare.ca{background:var(--rk);color:var(--rh);font-weight:600;font-size:15px}
.ray-kare.ca svg{width:24px;height:24px}
.ray-kare.ca:hover{box-shadow:0 0 0 2px var(--yan-2),0 0 0 3.5px var(--yan-3)}
.ray-kare.ca[aria-current="true"]{box-shadow:0 0 0 2px var(--yan-2),0 0 0 4px var(--rh)}
.ray-kilit{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--kart);color:var(--ilke);display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--yan-2)}
.ray-kare .ray-kilit svg{width:10px;height:10px}
.ray-marka{color:var(--yazi)}.ray-marka svg{width:24px;height:24px}#programIkon{display:grid}
.ray-ayrac{width:22px;height:1px;flex-shrink:0;background:var(--kenar);margin:2px 0}
.ray-ekle{font-size:20px;font-weight:300}
.liste-yan{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:10px 8px 16px;overflow:auto}
.ly-ust{display:flex;align-items:center;gap:2px;min-height:36px;margin-bottom:2px;padding:0 4px 0 2px;border-radius:8px;background:var(--yan-3)}
.ly-ust:empty{background:none}
.ca-menu{width:240px;gap:1px}
/* Çalışma alanı (K-082): raydaki + kesik çizgili kutu, yanında kart; kareye sağ tık ya da liste başındaki ▾ menüyü açar */
.ray-ekle{border:1.5px dashed var(--kenar-3);color:var(--yazi-2);font-size:19px;font-weight:400}
.ray-ekle:hover,.ray-ekle[aria-expanded="true"]{border-color:var(--yazi-2);background:var(--kart);color:var(--yazi)}
.ca-menu.cy{width:330px;padding:14px;gap:0}
.cy-ust{display:flex;gap:12px;align-items:center}
.cy-ik{width:46px;height:46px;flex:none;border-radius:11px;border:1.5px dashed var(--kenar-3);display:grid;place-items:center;font-size:19px;font-weight:600;background:var(--prz);color:var(--pr)}
.cy-ust .cm-girdi{margin:0;min-width:0;width:100%}
.cy small{display:block;font-size:12px;color:var(--soluk);margin-top:4px;line-height:1.35}
.cy-satir{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--soluk)}
.cy-renk{display:flex;gap:5px}
.cy-renk button{width:18px;height:18px;border-radius:99px;border:0;padding:0;cursor:pointer;background:var(--r)}
.cy-renk button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--kart),0 0 0 3.5px var(--yazi-2)}
.cy-iz{display:flex;align-items:center;gap:10px;margin-top:12px;border:0;background:none;padding:0;cursor:pointer;font:inherit;text-align:left;color:var(--yazi)}
.cy-iz .anahtar{margin:0}.cy-iz b{font-size:13px;font-weight:600}.cy-iz small{margin-top:1px}
.cy-hata{font-size:12.5px;color:var(--tehlike);margin-top:10px}
.cy-alt{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--kenar);font-size:12px;color:var(--soluk)}
.cy-olustur{height:30px;padding:0 12px;border:0;border-radius:8px;background:var(--yazi);color:var(--kart);font:inherit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.cy-olustur:disabled{opacity:.35;cursor:default}.cy-olustur kbd{font:500 11px 'Geist Mono',monospace;opacity:.6}
.cm-satir[role="menuitemcheckbox"] .anahtar{margin-left:auto}
.cm-sira{cursor:default}.cm-sira:hover{background:none;color:var(--yazi-2)}
.cm-sira button{border:0;background:var(--yan-2);border-radius:6px;height:24px;padding:0 8px;font:inherit;font-size:12px;color:var(--yazi-2);cursor:pointer}
.cm-sira button:hover{color:var(--yazi);background:var(--kenar-2)}.cm-sira button:disabled{opacity:.35;cursor:default}
.ly-ok{flex:none;width:22px;height:26px;margin-left:-6px;border:0;border-radius:6px;background:none;cursor:pointer;display:grid;place-items:center;color:var(--soluk);padding:0}
.ly-ok:hover,.ly-ok[aria-expanded="true"]{background:var(--kenar-2);color:var(--yazi)}.ly-ok svg{width:12px;height:12px}
.cm-satir{display:flex;align-items:center;gap:9px;height:32px;padding:0 6px;border:0;border-radius:6px;background:none;cursor:pointer;font-size:13.5px;color:var(--yazi-2);text-align:left}
.cm-satir:hover{background:var(--yan-2);color:var(--yazi)}
.cm-satir[aria-current="true"]{color:var(--yazi);font-weight:500}
.cm-satir .cm-ad{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-satir .av{flex:none}
.cm-satir>i{display:grid;color:var(--karar)}.cm-satir svg{width:14px;height:14px}
.cm-satir .cm-ik{width:18px;flex:none;display:grid;place-items:center;color:var(--soluk)}
.cm-girdi{height:34px;margin:2px 6px 4px;padding:0 10px;border:1px solid var(--kenar-2);border-radius:8px;background:var(--kart);font:inherit;font-size:14px;color:var(--yazi);outline:none;min-width:260px}
.cm-girdi:focus{border-color:var(--yol)}.cm-ipucu{display:block;padding:0 10px 6px;font-size:12px;color:var(--soluk)}
.cm-satir>i svg{width:13px;height:13px}
.cm-ayrac{height:1px;background:var(--kenar);margin:4px 2px}
.ly-k{display:flex;gap:2px;margin-left:auto;flex:none}
.ly-k button{width:28px;height:28px;border:0;border-radius:7px;background:none;cursor:pointer;display:grid;place-items:center;color:var(--soluk);padding:0}
.ly-k button:hover{background:var(--kenar-2);color:var(--yazi)}
.ly-k svg{width:15px;height:15px}
.ly-k .izole{color:var(--r-yesil)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ly-ad{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:8px;height:30px;padding:0 6px;border:0;border-radius:6px;background:none;cursor:pointer;font-weight:600;font-size:14.5px;text-align:left}
.ly-ad:hover{background:var(--kenar-2)}
.ly-ad span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly-izole{height:26px;padding:0 7px;border:0;border-radius:6px;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--soluk);flex-shrink:0}
.ly-izole svg{width:13px;height:13px}
.ly-izole:hover{background:var(--yan-2);color:var(--yazi)}
.ly-izole.izole{color:var(--ilke)}
.oge kbd{margin-left:auto;font:11.5px Geist,sans-serif;color:var(--soluk-2)}
/* ⌘K: her yerden git */
.komut{position:fixed;inset:0;z-index:60;background:none;display:flex;justify-content:center;align-items:flex-start;padding:14vh 16px 0}
.komut-kutu{width:min(560px,100%);background:var(--kart);border:1px solid var(--kenar);border-radius:var(--kat-kose);box-shadow:var(--kat-golge);overflow:hidden}
.komut-giris{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--kenar)}
.komut-giris svg{width:16px;height:16px;color:var(--soluk);flex-shrink:0}
.komut-giris input{flex:1;height:48px;border:0;outline:none;background:none;font-size:15px}
.komut-sonuc{max-height:min(420px,60vh);overflow:auto;padding:6px}
.komut-sonuc button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:7px;background:none;cursor:pointer;text-align:left;font-size:14px}
.komut-sonuc button>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.komut-sonuc button svg{width:16px;height:16px;color:var(--soluk);flex-shrink:0}
.komut-sonuc button[aria-selected="true"]{background:var(--yan-2)}
.komut-sonuc small{margin-left:auto;padding-left:12px;color:var(--soluk);font-size:12px;white-space:nowrap}
.komut-bos{padding:14px;color:var(--soluk);font-size:13px}
.marka{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;margin-bottom:6px;font-weight:600;font-size:14px}
.marka-ikon{width:20px;height:20px;display:block}
.oge{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;cursor:pointer;text-align:left;color:var(--yazi-2);font-size:14px}
.oge:hover{background:var(--yan-2)}
.oge[aria-current="true"]{background:var(--yan-3);color:var(--yazi);font-weight:500}
.ikon{width:18px;height:18px;display:grid;place-items:center;color:var(--soluk);font-size:12px;flex-shrink:0}
.ikon svg{width:16px;height:16px}
.bolum{display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 6px 0 8px;margin-top:16px;font-size:12px;font-weight:500;color:var(--soluk)}
.bolum button{width:22px;height:22px;border:0;border-radius:5px;background:none;cursor:pointer;color:var(--soluk);font-size:16px;line-height:1;opacity:0;transition:opacity .12s}
#yan:hover .bolum button{opacity:1}
.bolum button:hover{background:var(--yan-3);color:var(--yazi)}
.yan-bos{padding:4px 8px;color:var(--soluk-2);font-size:13px}
/* Kenar çubuğu bir noktaya kadar daralır: 60 px ikon rayı, adlar ipucunda (⌘\ ya da üst çubuktaki düğme) */
/* Dar düzen: kenar çubuğu tümüyle sola çekilir (genişlik değişmez, içi sıkışmaz); tek düğme ya da ⌘\ geri açar */
/* Liste kendi açılır, kendi kapanır (düğme yok): çalışma alanlarının ya da listenin üstüne gelince yüzer, fare çekilince
   kısa bir beklemeyle kapanır. Ray hep görünür; sayfa raydan sonra başlar */
#yan{width:56px}
.liste-yan{position:fixed;left:56px;top:0;bottom:0;width:220px;z-index:40;background:var(--yan);border-right:1px solid var(--kenar);box-shadow:10px 0 28px -18px rgba(55,53,47,.35);opacity:0;visibility:hidden;transform:translateX(-6px);transition:opacity .14s ease .18s,transform .14s ease .18s,visibility 0s linear .32s}
#yan:has(.ray-liste:hover) .liste-yan,.liste-yan:hover,.liste-yan:focus-within{opacity:1;visibility:visible;transform:none;transition:opacity .14s ease .06s,transform .14s ease .06s,visibility 0s linear .06s}
/* Üst çubuk her sekmede aynı yerde: sekmeler kaymaz, etiketler kalır. Çizim'de tuvalin üstünde saydam durur,
   öğeleri kendi zeminiyle yüzer; tuval tam alan kalır */
body.cizimde #ust,body.ortakta #ust,body.alanda #ust{position:absolute;top:0;left:0;right:0;z-index:15;background:none;pointer-events:none}
body.cizimde #ust>*:not(.dol),body.ortakta #ust>*:not(.dol),body.alanda #ust>*:not(.dol){pointer-events:auto}
/* Codex açıkken ekran ikiye bölünür (K-041), Çizim'de de: üst çubuk yalnız sol yarının üstünde yüzer */
body.cizimde:has(#icerik.dolu:not(.panel-kapali)) #ust,body.alanda:has(#icerik.dolu:not(.panel-kapali)) #ust{right:calc(var(--cx-gen, 44%) + 9px)}
.satirgir{width:100%;height:32px;padding:0 10px;border:1px solid var(--karar);border-radius:8px;background:var(--kart);outline:none}
#ana{position:fixed;left:56px;top:0;right:0;bottom:0;display:flex;flex-direction:column}
#ust{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;background:var(--zemin)}
/* Tek parça çubuk (K-042): her sekmede aynı yerde; yazarken solar, fare kıpırdayınca döner */
.tek-cubuk{display:flex;align-items:center;gap:2px;height:38px;padding:0 4px;border:1px solid var(--kenar);border-radius:10px;background:var(--kart);box-shadow:0 6px 20px -12px rgba(55,53,47,.35);min-width:0;transition:opacity .3s}
body.yaziyor .tek-cubuk{opacity:.45}
/* + Veri çubuktan ayrı, hemen yanında kendi hapı (K-058) */
.veri-hap{margin-left:-2px;padding:0 3px;flex-shrink:0}
.tek-cubuk .ay{width:1px;height:18px;background:var(--kenar);margin:0 4px;flex-shrink:0}
.tek-cubuk .sy-sekmeler{background:none;padding:0}
.tek-cubuk .sy-sekme{height:30px}
.tek-cubuk .sy-sekme[aria-selected="true"]{background:var(--yan-2);box-shadow:none}
.tek-cubuk .ust-dugme{height:30px}
#ustIzole:empty{display:none}
/* Video ayrı düğmede (K-045): YouTube linki ya da bilgisayardan video; Kaynaklar'da sıraya girer */
#ustSag{display:flex;align-items:center;gap:8px}
.ust-video{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:1px solid var(--kenar);border-radius:10px;background:var(--kart);box-shadow:0 6px 20px -12px rgba(55,53,47,.35);font:inherit;font-size:13px;color:var(--yazi-2);cursor:pointer}
.ust-video:hover{color:var(--yazi)}.ust-video svg{width:15px;height:15px}
.kv-acilir{cursor:pointer}.kv-acilir:hover b{color:var(--yol)}
/* Video görünümü A (K-045): oynatıcı, bölümler, kare şeridi, kilit anlar; içeriğin üstünde açılır, Esc ya da × kapatır */
.vg{position:absolute;inset:0;z-index:25;background:var(--zemin);overflow:auto}
.vg-ic{max-width:1180px;margin:0 auto;padding:28px 32px 48px}
.vg-bas{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}.vg-bas h2{margin:0;font-size:22px;letter-spacing:-.01em}
.vg-bas small{display:block;color:var(--soluk);font-size:13px;margin-top:4px}.vg-bas button{margin-left:auto}
.vg-ust{display:flex;gap:24px;align-items:flex-start}
.vg-oyn{flex:1.7;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--ters)}
.vg-oyn iframe,.vg-oyn video{width:100%;height:100%;border:0;display:block}
.vg-bol{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;max-height:480px;overflow:auto}
.vg-bol h3,.vg-alt h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--soluk);letter-spacing:.02em}
.vg-bol button{display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 8px;border:0;border-radius:7px;background:none;font:inherit;font-size:13.5px;text-align:left;color:var(--yazi-2);cursor:pointer}
.vg-bol button:hover,.vg-bol button.on{background:var(--yan-2);color:var(--yazi)}
.vg-bol b{font:500 12px 'Geist Mono',monospace;color:var(--soluk);width:44px;flex:none;padding-top:1px}
.vg-ana{font-size:15px;line-height:1.55;margin:0 0 12px;color:var(--yazi)}
.vg-kareler{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.vg-kareler button{flex:none;width:150px;border:0;padding:0;background:none;cursor:pointer;text-align:left}
.vg-kareler img{width:150px;height:84px;object-fit:cover;border-radius:8px;display:block;box-shadow:0 0 0 1px var(--kenar)}
.vg-kareler button:hover img{box-shadow:0 0 0 2px var(--yol)}
.vg-kareler small{font:500 11px 'Geist Mono',monospace;color:var(--soluk)}
.vg-alt{margin-top:22px}
.vg-anlar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.vg-anlar button{border:1px solid var(--kenar);border-radius:10px;background:var(--kart);padding:12px 14px;text-align:left;font:inherit;font-size:13.5px;line-height:1.5;cursor:pointer;color:var(--yazi)}
.vg-anlar button:hover{border-color:var(--kenar-3)}.vg-anlar small{display:block;font:500 11.5px 'Geist Mono',monospace;color:var(--soluk);margin-bottom:4px}
.izole-etiket{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;margin-left:2px;border:0;border-radius:99px;font:inherit;font-size:11.5px;font-weight:500;cursor:pointer;color:var(--soluk);background:var(--yan-2)}
.izole-etiket.izole{color:var(--r-yesil);background:var(--r-yesil-z)}
.izole-etiket svg{width:12px;height:12px}
#yol{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:7px;font-size:14px;min-width:0;white-space:nowrap;color:var(--yazi-2)}
#yol:empty{display:none}
#yol b{font-weight:400;color:var(--yazi);overflow:hidden;text-overflow:ellipsis}
#yol a{color:var(--soluk);padding:2px 4px;margin:0 -4px;border-radius:4px}#yol a:hover{color:var(--yazi);background:var(--yan-2)}
#yol .ayrac{color:var(--kenar-3)}
.ust-dugme{height:28px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--soluk);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.ust-dugme:hover{background:var(--yan-2);color:var(--yazi)}
.ust-dugme svg{width:15px;height:15px;flex-shrink:0}
.ust-dugme.izole{color:var(--ilke)}
#ustEk{display:flex;align-items:center;gap:6px}
.dol{flex:1}
.ana-dugme{height:32px;padding:0 12px;border-radius:6px;border:0;background:var(--ters);color:var(--ters-yazi);font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(26,26,28,.22),inset 0 1px 0 rgba(255,255,255,.1)}
.ana-dugme:active{box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.ikincil{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--kenar-2);background:var(--kart);cursor:pointer;font-size:13px;white-space:nowrap;color:var(--yazi-2);box-shadow:0 1px 1.5px rgba(55,53,47,.07)}
.ikincil:active{box-shadow:none;background:var(--yan)}
.ikincil:hover{background:var(--yan-2)}
/* Sekmeler Notion görünümleri gibi: başlığın altında, alt çizgili */
.sekmeler{display:flex;gap:18px;border-bottom:1px solid var(--kenar)}
.sekme{height:36px;padding:0 2px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--soluk);font-size:14px;cursor:pointer}
.sekme:hover{color:var(--yazi)}
.sekme[aria-selected="true"]{color:var(--yazi);border-bottom-color:var(--yazi)}
#icerik{flex:1;overflow:auto;min-height:0;position:relative}
#icerik.dolu{overflow:hidden;display:flex}
.yuzey{flex:1;position:relative;min-width:0}
.yuzey iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* Sayfa, Notion gibi: ortada, geniş boşluk, büyük başlık, kısa gri açıklama */
.sayfa{max-width:1000px;margin:0 auto;padding:64px 56px 80px}
.sayfa.genis{max-width:none;height:100%;display:flex;flex-direction:column;padding:48px 40px 24px}
/* Sayfa iskeleti (K-070): Çalışma alanı, Çöp, Ayarlar ve Ortak beyindeki Ben ile Son eklenenler de Defter gibi noktalı zeminde
   980 px'lik kâğıt; üst çubuk kâğıdın üstünde yüzer. Tek başlık kalıbı .sb: 52 px ikon kutusu, başlık, altında meta, sağda eylem. */
body:has(#icerik>.sayfa:not(.genis)) #ust{position:absolute;top:0;left:0;right:0;z-index:15;background:none;pointer-events:none}
body:has(#icerik>.sayfa:not(.genis)) #ust>*:not(.dol){pointer-events:auto}
#icerik:has(>.sayfa:not(.genis)){background-color:var(--yan);background-image:radial-gradient(var(--nokta) 1.1px,transparent 1.4px);background-size:22px 22px}
.sayfa:not(.genis){max-width:980px;min-height:calc(100vh - 150px);margin:104px auto 120px;padding:64px 64px 80px;background:var(--kart);border-radius:14px;box-shadow:0 0 0 1px var(--kenar),0 24px 60px -36px rgba(55,53,47,.45)}
.sb{display:flex;align-items:center;gap:16px}
.sb-ik{width:52px;height:52px;border-radius:12px;background:var(--yan);display:grid;place-items:center;flex:none}
.sb-ik .av{width:52px;height:52px;font-size:22px;border-radius:12px}
.sb-orta{flex:1;min-width:0}.sb-meta{margin:2px 0 0;font-size:13.5px;color:var(--soluk)}
.sb-sag{display:flex;align-items:center;gap:6px;flex:none}.sb-sag .ca-ag{margin:0}
.sb+.alt-baslik{margin-top:14px}.sb+.sekmeler{margin-top:22px}
/* kâğıdın içinde kart: çerçeve içinde çerçeve olmasın diye gölgesiz */
.sayfa:not(.genis) .kart{box-shadow:none}.sayfa:not(.genis) .ent-kart{box-shadow:0 0 0 1px var(--kenar)}
.baslik-satiri{display:flex;flex-direction:column;align-items:stretch;gap:0}
.baslik-satiri>.dol{display:none}
.baslik-satiri .sekmeler{margin-top:22px}
.ca-ag{height:30px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--soluk);font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:6px}
.ca-ag:hover{background:var(--yan-2);color:var(--yazi)}.ca-ag svg{width:15px;height:15px}
.sayfa h1{margin:0;font-size:38px;font-weight:700;line-height:1.2;letter-spacing:-.02em;color:var(--yazi)}
.alt-baslik{margin:8px 0 0;color:var(--soluk);font-size:15px;max-width:640px}
.alt-baslik:empty{display:none}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:28px}
.kart{display:flex;flex-direction:column;border-radius:6px;background:var(--kart);border:1px solid var(--kenar);box-shadow:0 1px 2px rgba(55,53,47,.04);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:background .12s}
.kart:hover{background:var(--kart-2)}
.kapak{aspect-ratio:16/10;background-color:var(--kart-2);border-bottom:1px solid var(--kenar);background-size:cover;background-position:top left}
.kart .bilgi{padding:10px 12px 12px}
.kart b{display:block;font-weight:500;color:var(--yazi)}
.kart small{color:var(--soluk);font-size:12px}
.kart.yeni{border-color:transparent;box-shadow:none;background:none;justify-content:center;align-items:center;min-height:180px;color:var(--soluk)}
.gorunum-sec{display:inline-flex;padding:2px;border-radius:8px;background:var(--yan);gap:2px}
.gorunum-sec button{height:26px;padding:0 10px;border:0;border-radius:6px;background:none;font-size:13px;color:var(--soluk);cursor:pointer}
.gorunum-sec button[aria-pressed="true"]{background:var(--kart);color:var(--yazi);box-shadow:0 1px 2px rgba(55,53,47,.12)}
.izgara.galeri{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.ca-kart{border-radius:12px;justify-content:flex-start}
.ca-kart .bilgi{flex:1}
.ca-kart .kapak{aspect-ratio:auto;height:150px}
.ca-kart .kapak.kapak-bos{display:grid;place-items:center;background:var(--rz)}
.ca-kart .bilgi{padding:12px 14px}.ca-kart .bilgi b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.izgara.galeri .kart.yeni{border:1.5px dashed var(--kenar-3);border-radius:12px;min-height:204px}
.izgara.galeri .kart.yeni:hover{border-color:var(--soluk-2);color:var(--yazi)}
.ca-tablo{width:100%;border-collapse:collapse;margin-top:28px;font-size:14px}
.ca-tablo th{text-align:left;font-weight:500;font-size:12.5px;color:var(--soluk);padding:8px 10px;border-bottom:1px solid var(--kenar)}
.ca-tablo td{padding:10px;border-bottom:1px solid var(--kenar);color:var(--yazi-2)}
.ca-tablo tbody tr[data-git]{cursor:pointer}.ca-tablo tbody tr[data-git]:hover{background:var(--yan)}
.ct-ad{display:flex;align-items:center;gap:8px;color:var(--yazi);font-weight:500}
.ct-sol{color:var(--soluk-2)}
.ct-codex{display:inline-flex;align-items:center;gap:7px;color:var(--yazi-2)}.ct-codex i{width:8px;height:8px;border-radius:50%;background:var(--r-yesil);box-shadow:0 0 0 3px var(--r-yesil-z)}
.ct-yeni{border:0;background:none;color:var(--soluk);cursor:pointer;font:inherit;padding:0}.ct-yeni:hover{color:var(--yazi)}
.ad-kutu small{font-size:11.5px;color:var(--soluk-2)}
.ad-kutu .satirgir{height:36px;border:0;border-radius:9px;box-shadow:0 0 0 1.5px var(--karar),0 0 0 4px var(--karar-zemin)}
.ak-ik{width:56px;height:56px;border-radius:12px;border:1.5px dashed var(--kenar-3);display:grid;place-items:center;color:var(--soluk-2);flex:none}
.ad-kutu.galeri{border-radius:12px;background:var(--kart);box-shadow:0 0 0 1.5px var(--karar);overflow:hidden;display:flex;flex-direction:column}
.ad-kutu.galeri .ak-ust{height:150px;background:var(--yan);display:grid;place-items:center}
.ad-kutu.galeri .ak-alt{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ad-kutu.liste{margin:4px 0;padding:8px;border-radius:10px;background:var(--kart);box-shadow:0 0 0 1.5px var(--karar),0 8px 20px -14px rgba(55,53,47,.5);display:flex;flex-direction:column;gap:6px}
.ad-kutu.liste .ak-satir{display:flex;gap:8px;align-items:center}
.ad-kutu.liste .ak-ik{width:22px;height:22px;border-radius:6px}
.ad-kutu.liste .satirgir{height:24px;border:0;box-shadow:none;padding:0;background:none;order:2}
.ad-kutu.liste .ak-ik{order:1}
.ad-kutu.tablo{display:flex;align-items:center;gap:12px}.ad-kutu.tablo .satirgir{max-width:320px}
.bos{margin-top:28px;padding:48px 24px;border-radius:6px;background:var(--kart-2);text-align:center;color:var(--soluk)}
.bos b{display:block;color:var(--yazi);font-size:16px;margin-bottom:4px}
.uc{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:28px}
.liste{display:flex;flex-direction:column;gap:1px;min-width:0}
.liste h2{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--soluk)}
/* Satır: çerçevesiz, üstüne gelince zemin (Notion listesi) */
.satir{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:5px;background:none;border:0;text-align:left;width:100%;color:var(--yazi)}
button.satir,a.satir{cursor:pointer}button.satir:hover,a.satir:hover{background:var(--yan-2)}
.satir .ust{display:block;font-weight:500}
.satir small{color:var(--soluk);font-size:12px}
.pin{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;font:600 11px 'Geist Mono',monospace;color:var(--ters-yazi);flex-shrink:0}
.yer{display:inline-block;margin-top:4px;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--notr-zemin);color:var(--yazi-2)}
.etiket{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
/* Ortak beyin ağı (K-035): tam ekran, üstte yüzen hap, sağ üstte sağlık, sağ altta önizleme */
#icerik.ob-icerik{overflow:hidden}
.ob{position:absolute;inset:0;overflow:hidden;background-color:var(--yan);background-image:radial-gradient(var(--nokta) 1.1px,transparent 1.4px);background-size:22px 22px;cursor:grab;touch-action:none;user-select:none}
.ob.tutuyor{cursor:grabbing}
.ob .ag-sigdir{right:auto;left:16px;bottom:14px;border:1px solid var(--kenar);background:var(--kart);z-index:3}
.ob-dunya{position:absolute;left:0;top:0;transform-origin:0 0}
.ob-kume{position:absolute;left:0;top:0;opacity:.36;transition:opacity .2s}
.ob-kume.on{opacity:1}
.ob-baglar{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.ob-baglar g:last-child line{stroke:var(--r);stroke-width:2;opacity:.55}
.ob-hap-bag line{stroke:var(--kenar-3);stroke-width:1}
.ob-merkez,.ob-dugum{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:var(--kart);display:grid;place-items:center;cursor:pointer;padding:0;transition:box-shadow .15s,transform .15s}
.ob-merkez{width:78px;height:78px;border:3px solid var(--r);box-shadow:0 0 0 7px var(--rz)}
.ob-dugum{width:60px;height:60px;border:2.5px solid var(--r)}
.ob-dugum:hover,.ob-merkez:hover{transform:translate(-50%,-50%) scale(1.06)}
.ob-dugum.sec{box-shadow:0 0 0 7px var(--rz),0 10px 24px -12px var(--r)}

.ob-sonuk{opacity:.14}

.ob-cip:hover{background:var(--yan)}

.ob-kart{position:absolute;top:14px;right:16px;width:340px;z-index:3;padding:18px 20px;border-radius:16px;background:var(--kart);box-shadow:0 0 0 1px var(--kenar),0 18px 50px -24px rgba(55,53,47,.45);display:flex;flex-direction:column;gap:6px;cursor:default}
.ob-kart:empty{display:none}
.ob-kart-bas{display:flex;align-items:center;gap:10px}.ob-kart-bas b{font-size:18px;font-weight:600}.ob-kart-bas .izole-etiket{margin-left:auto;cursor:default}

.ob-kart-not .kod{flex:none;min-width:28px;height:22px;padding:0 6px;border-radius:99px;color:var(--kart);font:600 11px 'Geist Mono',monospace;display:grid;place-items:center}

.ob-kart-git{color:var(--karar);font-size:14px;text-decoration:none;margin-top:8px}.ob-kart-git:hover{text-decoration:underline}

.ob-saglik{position:absolute;bottom:56px;right:16px;width:280px;max-height:calc(100% - 340px);overflow:auto;z-index:2;padding:12px 14px;border:1px solid var(--kenar);border-radius:10px;background:var(--kart);box-shadow:0 6px 18px -12px rgba(55,53,47,.3);display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--yazi-2)}
.ob-rozet{position:absolute;bottom:14px;right:16px;z-index:3;height:32px;padding:0 12px;border:1px solid var(--kenar);border-radius:999px;background:var(--kart);box-shadow:0 6px 18px -12px rgba(55,53,47,.35);font-size:12.5px;color:var(--soluk);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.ob-rozet i{width:8px;height:8px;border-radius:50%;background:var(--r-yesil)}.ob-rozet.var i{background:var(--soru)}

.ob-saglik>div>span:last-child,.ob-saglik summary>span:last-child{font-family:'Geist Mono',monospace;color:var(--soluk)}

.ob-liste{display:flex;flex-direction:column;gap:1px;margin:4px 0 2px}
.ob-satir{display:block;text-align:left;border:0;background:none;padding:4px 6px;margin:0 -6px;border-radius:5px;font-size:12px;color:var(--yazi-2);cursor:pointer;line-height:1.4}

.ob-taraniyor i{width:3px;height:3px;border-radius:50%;background:currentColor;animation:aiNokta 1.2s infinite}.ob-taraniyor i:nth-of-type(2){animation-delay:.15s}.ob-taraniyor i:nth-of-type(3){animation-delay:.3s}
.ob-peek{position:absolute;right:16px;bottom:14px;width:320px;max-height:46%;overflow:auto;z-index:2;padding:14px 16px;border:1px solid var(--kenar);border-radius:10px;background:var(--kart);box-shadow:0 14px 36px -18px rgba(55,53,47,.35);gap:8px;animation:sozGel .18s ease-out}

/* Ağ */
.ag-satir{flex:1;display:flex;gap:24px;min-height:0;margin-top:20px}

.ob-obs .ob-ag{position:absolute;inset:0;border:0;border-radius:0;background:var(--zemin);min-height:0}

.ob-obs .ob-kart.ayrinti:empty{display:none}
/* Boş ağ (ilk açılış): ne yapılacağı tek satırda, öğreticiye tek tık */
.ob-bos{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--yazi-2);font-size:14px;line-height:1.5}

.ob-bos b{font-size:16px;color:var(--yazi)}.ob-bos p{margin:0}
.ob-bos button{margin-top:8px;height:32px;padding:0 14px;border:0;border-radius:8px;background:var(--yazi);color:var(--kart);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.ob-izole{display:inline-grid;margin-left:-2px;color:var(--soluk)}.ob-izole svg{width:11px;height:11px}
.ag-kap{flex:1;position:relative;overflow:hidden;border-radius:6px;background:var(--kart);border:1px solid var(--kenar);cursor:grab;touch-action:none;min-height:420px}
.ag-tuval{position:absolute;inset:0;display:block}
.ag-kap.ag-uzerinde{cursor:pointer}.ag-kap.ag-tutuyor{cursor:grabbing}
.ag-sigdir{position:absolute;right:10px;bottom:10px;height:26px;padding:0 10px;border-radius:5px;border:0;background:none;color:var(--soluk);font-size:12.5px;cursor:pointer}
.ag-sigdir:hover{border-color:var(--kenar-3);color:var(--yazi)}
.ayrinti{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:18px;overflow:auto}
.ayrinti .kutu{padding:2px 0 0;display:flex;flex-direction:column;gap:8px}
.ayrinti .ipucu{font-size:12.5px;color:var(--soluk-2);line-height:1.5}
.ayrinti .tur{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--soluk)}
.ayrinti .bas{font-size:16px;font-weight:600;line-height:1.35}
.soz{font-size:13px;font-style:italic;color:var(--yazi-2);border-left:2px solid var(--kenar-2);padding-left:8px;line-height:1.45}
.lejant{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--yazi-2)}
.lejant div{display:flex;align-items:center;gap:8px}
.lejant i{width:10px;height:10px;border-radius:999px;display:inline-block}
.lejant span{margin-left:auto;font:11px 'Geist Mono',monospace;color:var(--soluk)}
/* Alan paneli */
/* Codex paneli her sekmede aynı yüzen kart (Çizim'deki gibi): üst çubuğun altında, kenarları yuvarlak; yarıda kalan çizgi yok */
.panel{width:var(--cx-gen, 44%);min-width:320px;max-width:65%;flex-shrink:0;overflow:hidden;background:var(--kart);display:flex;flex-direction:column;min-height:0}
/* Bölme tutamağı: sürükleyince Codex'in genişliği değişir, beyin:codex-genislik'te kalır */
.bolme{width:9px;flex-shrink:0;display:grid;place-items:center;border-left:1px solid var(--kenar);background:var(--kart);cursor:col-resize;touch-action:none}
.bolme i{width:3px;height:36px;border-radius:9px;background:var(--kenar-3);transition:background .12s,height .12s}
.bolme:hover i,body.boluyor .bolme i{background:var(--yol);height:52px}
body.boluyor{cursor:col-resize;user-select:none}body.boluyor iframe{pointer-events:none}
#icerik.panel-kapali .bolme{display:none}
.panel-ust{height:44px;flex-shrink:0;display:flex;align-items:stretch;gap:4px;padding:0 10px 0 14px;border-bottom:1px solid var(--kenar)}
.panel-ust .sekmeler{border:0}.panel-ust .sekme{height:100%;font-size:13.5px}
.panel-ust .panel-kapat,.panel-ust .panel-baslik{align-self:center}
/* Panel kapanınca sağ altta baloncuk kalır; Codex arkada çalışmayı sürdürür, baloncuk durumunu gösterir */
.panel-kapat{margin-left:auto;width:28px;height:28px;border:0;border-radius:8px;background:none;color:var(--soluk);cursor:pointer;display:grid;place-items:center}
.panel-kapat:hover{background:var(--yan-2);color:var(--yazi)}
#icerik.panel-kapali .panel{display:none}
/* Codex'in sesi (K-034): panel kapalıyken baloncuğun yanında ne yaptığı; bitince bir an "Bitti", cevap beklerken kalır */
.codex-soz{position:fixed;z-index:12;max-width:min(440px,60%);height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--kenar);background:var(--kart);box-shadow:0 6px 18px -10px rgba(55,53,47,.3);display:inline-flex;align-items:center;gap:3px;font-size:12.5px;color:var(--yazi-2);cursor:pointer;animation:sozGel .22s ease-out}
.codex-soz span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:3px}
.codex-soz.calisiyor span{background:linear-gradient(90deg,var(--yazi-2) 0%,var(--soluk-2) 50%,var(--yazi-2) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:cxParilti 1.6s linear infinite}
.codex-soz i{width:3px;height:3px;border-radius:50%;background:var(--soluk);animation:aiNokta 1.2s infinite;flex-shrink:0}
.codex-soz i:nth-of-type(2){animation-delay:.15s}.codex-soz i:nth-of-type(3){animation-delay:.3s}
.codex-soz.bekliyor{border-color:var(--soru);color:var(--soru-koyu);background:var(--soru-zemin)}
.codex-soz.bitti{color:var(--ilke)}
[data-ust-codex]{position:relative}
[data-ust-codex]::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:999px;display:none}
[data-ust-codex].cx-calisiyor::after{display:block;background:var(--karar);animation:balonNefes 1.4s ease-in-out infinite}
[data-ust-codex].cx-bekliyor::after{display:block;background:var(--soru)}
[data-ust-codex].cx-yeni::after{display:block;background:var(--ilke)}
/* Doğrulama (K-069): Codex'in öğrendikleri üstteki Codex düğmesinde birikir; açılır liste ⋯ menüsünün diliyle */
.dg-rozet{position:absolute;right:-5px;top:-5px;min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;border-radius:99px;background:var(--soru);color:var(--kart);font:600 10.5px/17px Geist,sans-serif;text-align:center;cursor:pointer;z-index:1}
.dg-kutu{position:fixed;z-index:30;width:340px;max-height:min(70vh,560px);overflow:auto;padding:14px;box-sizing:border-box;background:var(--kart);border:1px solid var(--kenar);border-radius:var(--kat-kose);box-shadow:var(--kat-golge);font-size:13px;line-height:1.5;color:var(--yazi)}
.dg-bas{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;font-weight:600}
.dg-oge{padding:10px 0;border-top:1px solid var(--kenar)}
.dg-iddia{padding:8px 10px;border-radius:8px;background:var(--soru-zemin);color:var(--soru-koyu);font-weight:500;outline:none}
.dg-iddia[contenteditable]{background:var(--kart);box-shadow:inset 0 0 0 1.5px var(--soru);color:var(--yazi)}
.dg-nere{margin-top:8px;font-size:12px;color:var(--soluk)}.dg-dgm{display:flex;gap:6px;margin-top:10px}.dg-dgm .ent-dugme{height:28px;font-size:12.5px}
.dg-hepsi{margin-top:6px;padding:0;border:0;background:none;font:inherit;font-size:12.5px;color:var(--yazi-2);cursor:pointer}.dg-hepsi:hover{color:var(--yazi)}
.kiv{flex-shrink:0;display:block}.ust-dugme .kiv{width:20px;height:20px}.kiv-yer{display:grid}
.kiv-ani .k1,.kiv-ani .k2{animation:kivKare .9s steps(1) infinite}.kiv-ani .k2{animation-delay:-.45s}
@keyframes kivKare{0%{opacity:1}50%{opacity:0}}
[data-hareket="kapali"] .kiv-ani .k1{animation:none}[data-hareket="kapali"] .kiv-ani .k2{animation:none;opacity:0}
.kiv-bas{display:flex;align-items:center;gap:5px}.kiv-sat{display:inline-flex;align-items:center;gap:6px}
.codex-soz .kiv{width:16px;height:16px;margin-right:6px}
@keyframes sozGel{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
@keyframes balonNefes{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.panel-ic{flex:1;overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:16px}
.grup{display:flex;flex-direction:column;gap:5px}
.grup-bas{display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:0 2px;cursor:pointer;text-align:left}
.grup-bas b{font-size:13px;font-weight:600}.grup-bas span{font:11px 'Geist Mono',monospace;color:var(--soluk)}
.not-satir{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:5px;border:0;background:none;cursor:pointer;text-align:left;font-size:13px;width:100%;color:var(--yazi)}
.not-satir:hover{background:var(--yan-2)}
.not-satir[aria-current="true"]{background:var(--secili)}
.not-satir.soluk{opacity:.55}
/* Codex paneli */
.panel-ic.cx-dolu{padding:0;overflow:hidden;display:block}
.cx{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--kart)}
.cx-akis{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px;min-height:0;scroll-behavior:smooth}
/* Sakin balon (K-073): dolgulu, çerçevesiz, en çok %72; uzun mesaj dört satırda katlanır */
.cx-sen{align-self:flex-end;max-width:72%;box-sizing:border-box;background:var(--yan-2);padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5}
.kabuk[data-tema="koyu"] .cx-sen{background:var(--yan-3)}
.cx-sen p{margin:0}.cx-sen p+p{margin-top:6px}
.cx-sen-metin{overflow-wrap:anywhere}.cx-sen-metin ol,.cx-sen-metin ul{margin:2px 0;padding-left:20px}
.cx-kisik .cx-sen-metin{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.cx-devam{display:block;margin-top:6px;padding:0;border:0;background:none;font:inherit;font-size:12.5px;color:var(--soluk);cursor:pointer}
.cx-devam:hover{color:var(--yazi)}
.cx-ayrac{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--soluk-2)}
.cx-ayrac::before,.cx-ayrac::after{content:'';flex:1;height:1px;background:var(--kenar)}
.cx-ayrac span{display:inline-flex;align-items:center;gap:5px}.cx-ayrac svg{width:12px;height:12px}
.cx-codex{display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.62;color:var(--yazi)}
.cx-metin p{margin:0 0 8px}.cx-metin p:last-child{margin-bottom:0}
.cx-metin ol,.cx-metin ul{margin:2px 0 8px;padding-left:20px}.cx-metin li{margin:3px 0}.cx-metin li::marker{color:var(--soluk)}
.cx-metin b{font-weight:600}
.cx-metin a{color:var(--yol)}.cx-bag{color:var(--yol);border-bottom:1px dashed currentColor;cursor:default}
.cx-codex code,.cx-kart code,.cx-dusunce code{font:12px 'Geist Mono',monospace;background:var(--kart-2);border:1px solid var(--kenar);padding:0 4px;border-radius:4px}
.cx-ignele{opacity:0;transition:opacity .15s;font-size:11.5px;color:var(--soluk);gap:4px}
.cx-codex:hover .cx-ignele{opacity:1}
.cx-ignele .cx-cip{height:22px;padding:0 8px;font-size:11.5px}
.cx-mesaj-ciz{display:inline-flex;align-items:center;gap:4px;margin-left:8px}.cx-mesaj-ciz svg{width:11px;height:11px}
.cx-adim{font-size:12.5px;color:var(--soluk);margin:-6px 0;animation:cxGel .28s ease-out}
@keyframes cxGel{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cx-suruyor b,.cx-suruyor .cx-ozet{background:linear-gradient(90deg,var(--yazi-2) 0%,var(--soluk-2) 50%,var(--yazi-2) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:cxParilti 1.6s linear infinite}
.cx-adim .cx-ikon{transition:color .3s}.cx-suruyor .cx-ikon{color:var(--karar)}
.cx-adim+.cx-adim{margin-top:-12px}
/* Canlı çizim (K-077): sohbette pano bloğu yerine tek satır; pano tuvalde akar */
.cx-pano-cip{display:flex;align-items:center;gap:7px;height:26px;font-size:12.5px;color:var(--soluk);min-width:0}
.cx-pano-cip b{font-weight:500;color:var(--yazi-2);flex-shrink:0}.cx-pano-cip .cx-ozet{font:inherit;font-size:12.5px}
.cx-pano-cip.cx-suruyor .cx-ikon{color:var(--karar)}
/* Adım grubu (K-073): art arda biten adımlar tek satır; satıra basınca hepsi açılır, süren adım hep görünür */
.cx-grup{display:flex;flex-direction:column;margin:-4px 0;font-size:12.5px;color:var(--soluk)}
.cx-grup-ic{display:flex;flex-direction:column}
.cx-grup .cx-adim,.cx-grup .cx-adim+.cx-adim{margin:-2px 0}
.cx-grup.cx-toplu:not(.cx-acik) .cx-adim:not(.cx-suruyor){display:none}
.cx-grup-bas{display:flex;align-items:center;gap:7px;height:26px;padding:0 8px;margin:-2px -8px;border:0;border-radius:7px;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0}
.cx-grup-bas:hover{background:var(--yan-2);color:var(--yazi-2)}
.cx-grup-bas b{font-weight:500;color:var(--yazi-2);flex-shrink:0}
.cx-say{flex-shrink:0;font-size:11.5px;color:var(--soluk-2)}

/* Veri paneli */
/* Veri: düğmenin altında küçük yüzen kart (Notion açılır penceresi gibi); sayfayı itmez */
#veri{position:fixed;top:52px;right:12px;width:380px;max-height:calc(100vh - 64px);overflow:auto;background:var(--kart);border:1px solid var(--kenar);border-radius:var(--kat-kose);box-shadow:var(--kat-golge);display:flex;flex-direction:column;gap:8px;padding:12px;z-index:30}
.vb{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:0 2px 2px 4px}.vb b{font-weight:600}
.vk-birak{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:88px;border-radius:10px;border:1.5px dashed var(--karar);background:var(--karar-zemin);cursor:pointer;text-align:center;font-size:12.5px;color:var(--yazi-2);outline:none;transition:background .12s}
.vk-birak b{font-weight:500}.vk-birak small{font-size:11.5px;color:var(--soluk)}
.vk-birak:hover,.vk-birak:focus-visible,.vk-birak.uzerinde{background:color-mix(in srgb,var(--karar-zemin) 70%,var(--karar) 12%)}
.vk-yt{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:9px;background:var(--yan)}
.vk-yt-ik{display:grid;color:var(--r-kirmizi);padding-top:2px}.vk-yt-ik svg{width:16px;height:16px}
#metin{flex:1;min-height:20px;max-height:120px;resize:none;padding:0;border:0;background:none;outline:none;line-height:1.5;font-size:13.5px;field-sizing:content}
.vk-oz{font-size:11.5px;font-weight:600;color:var(--soluk-2);letter-spacing:.03em;padding:4px 2px 0}
#vkListe{display:flex;flex-direction:column}
.vk-satir{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px solid var(--kenar);font-size:13px}
.vk-satir .vk-ik{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--yan-2);color:var(--soluk)}
.vk-satir .vk-ik svg{width:14px;height:14px}
.vk-satir[data-tur="youtube"] .vk-ik,.vk-satir[data-tur="video"] .vk-ik{background:var(--r-kirmizi-z);color:var(--r-kirmizi)}
.vk-satir[data-tur="web"] .vk-ik{background:var(--r-mavi-z);color:var(--r-mavi)}
.vk-satir[data-tur="pdf"] .vk-ik{background:var(--r-turuncu-z);color:var(--r-turuncu)}
.vk-satir[data-tur="gorsel"] .vk-ik{background:var(--r-yesil-z);color:var(--r-yesil)}
.vk-satir .vk-ad{flex:1;min-width:0}.vk-satir .vk-ad b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vk-satir .vk-ad small{font-size:11.5px;color:var(--soluk-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.vk-satir .vk-du{font-size:11.5px;color:var(--r-yesil);white-space:nowrap}.vk-satir .vk-du.bekle{color:var(--soluk-2)}.vk-satir .vk-du.sira{color:var(--karar)}.vk-satir .vk-du.hata{color:var(--tehlike)}
.vk-cdurum{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:9px;background:var(--yan);font-size:12.5px;color:var(--yazi-2)}
.vk-cdurum b{font-weight:500;display:flex;align-items:center;gap:7px}.vk-cdurum b i{width:8px;height:8px;border-radius:99px;background:var(--r-yesil);box-shadow:0 0 0 3px var(--r-yesil-z)}
.vk-cdurum .serit{height:3px;border-radius:99px;background:var(--yan-2);overflow:hidden}.vk-cdurum .serit i{display:block;height:100%;background:var(--r-yesil);transition:width .4s}
.vk-cdurum a{color:var(--karar);text-decoration:none;cursor:pointer}
.vk-hedef{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soluk);padding:6px 2px 0}
#hedefSec{margin-left:auto;display:flex;gap:4px}
#hedefSec button{height:24px;padding:0 9px;border:0;border-radius:99px;background:var(--yan);color:var(--yazi-2);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
#hedefSec button svg{width:12px;height:12px}
#hedefSec button[aria-pressed="true"]{background:var(--r-yesil-z);color:var(--r-yesil);font-weight:500}
.vk-codex{display:flex;align-items:center;gap:8px;height:30px;padding:0 2px;border:0;background:none;cursor:pointer;font-size:13px;color:var(--yazi-2);text-align:left}
.vk-not{font-size:11.5px;color:var(--soluk);padding:0 2px;margin-top:-6px}
.vk-alt{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--soluk-2);padding-left:2px}
.vk-alt .ana-dugme{height:30px;padding:0 14px;font-size:13px;border-radius:9px}
.vk-son summary{font-size:12px;color:var(--soluk);cursor:pointer;list-style:none;padding:4px 2px}.vk-son summary::-webkit-details-marker{display:none}
.vk-son summary::after{content:' ›'}.vk-son[open] summary::after{content:' ⌄'}
#sonVeri{display:flex;flex-direction:column;gap:2px;padding:0 2px}
#sonVeri>small{font-size:12.5px;color:var(--soluk-2)}
#birak{position:fixed;inset:12px;border-radius:18px;border:2px dashed var(--karar);background:color-mix(in srgb,var(--karar-zemin) 88%,transparent);display:grid;place-items:center;font-size:18px;font-weight:600;z-index:40;pointer-events:none}
#bildirim{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 14px;background:var(--ters);color:var(--ters-yazi);border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#bildirim.acik{opacity:1}
#bildirim.eylemli{display:flex;gap:14px;align-items:center;padding:6px 6px 6px 14px}#bildirim.eylemli.acik{pointer-events:auto}
#bildirim button{height:26px;padding:0 10px;border:0;border-radius:6px;background:var(--kart);color:var(--yazi);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
/* Defter (K-025, kodda "sayfa"): Notion benzeri serbest not (Yazı) ve sayfanın tuvali (Çizim) */
.agac{display:flex;flex-direction:column;gap:1px}
.agac-satir{display:flex;align-items:center;border-radius:6px;min-width:0;position:relative;padding-left:var(--d,0px)}
.agac-satir:hover{background:var(--yan-2)}
/* Liste A (K-045): tutamak üstüne gelince görünür, satır sürüklenerek sıralanır */
.agac-tut{position:absolute;left:-2px;top:0;bottom:0;width:14px;display:grid;place-items:center;font-size:11px;letter-spacing:-2px;color:var(--soluk-2);cursor:grab;opacity:0;transition:opacity .12s;touch-action:none;user-select:none}
.agac-satir:hover .agac-tut{opacity:1}
.agac-satir.suruklenen{z-index:5;background:var(--kart);box-shadow:0 10px 26px -12px rgba(55,53,47,.45),0 0 0 1px var(--kenar);pointer-events:none}
.sira-cizgi{position:absolute;left:8px;right:8px;height:2px;border-radius:9px;background:var(--yol);pointer-events:none;z-index:6}
body.siraliyor{cursor:grabbing;user-select:none}
.agac-satir[aria-current="true"]{background:var(--secili-z,var(--yan-3))}
/* Kimlik (K-031): çalışma alanının emojisi ve sessiz rengi, alanın emojisi; renk yalnız avatar, yol ve seçili alan satırında */
.av{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:600;line-height:1}
.av.px-av{background:none}.px{display:block}.ip{display:inline-grid;vertical-align:-3px;margin-right:6px}
.av.yalin{background:none;width:16px;height:16px;font-size:13px}
.renk-kare{width:8px;height:8px;border-radius:2px;margin:0 4px;flex-shrink:0}
.yol-av{border:0;background:none;padding:2px;margin:0 -2px;border-radius:4px;cursor:pointer;display:inline-grid;place-items:center;font-size:14px;line-height:1}
.yol-av:hover{background:var(--yan-2)}
.sy-ikon{display:block;height:64px;padding:0 6px;margin:0 0 6px -6px;border:0;border-radius:8px;background:none;font-size:52px;line-height:64px;cursor:pointer}
.sy-ikon.px{display:grid;place-items:center;width:68px;height:68px;padding:0}
.sy-ikon:hover{background:var(--yan-2)}
.sy-ikon.bos{height:28px;line-height:28px;font-size:13px;color:var(--soluk);opacity:0;transition:opacity .12s}
.sy:hover .sy-ikon.bos,.sy-ikon.bos:focus-visible{opacity:1}
.kimlik-sec{position:fixed;z-index:40;width:288px;background:var(--kart);border:1px solid var(--kenar);border-radius:var(--kat-kose);box-shadow:var(--kat-golge);padding:8px;display:flex;flex-direction:column;gap:6px}
.ks-bas{font-size:11.5px;font-weight:500;color:var(--soluk);padding:2px 4px}
.ks-px{display:flex;gap:12px;align-items:center;padding:4px}
.ks-px>svg,.ks-px-bos{width:72px;height:72px;flex:none;border-radius:10px;background:var(--yan)}
.ks-px-bos{display:grid;place-items:center;color:var(--soluk-2);font-size:22px}
.ks-ciz{flex:1;display:flex;flex-direction:column;gap:6px}
.ks-ciz input{height:30px;padding:0 9px;border:1px solid var(--kenar);border-radius:7px;font-size:12.5px;outline:none;background:var(--kart)}
.ks-ciz input:focus{border-color:var(--kenar-3)}.ks-ciz .ikincil{align-self:flex-start}
/* Liste durumu (K-039 adım 2): son değişiklik, Codex nabzı, Canlı */
.agac-uc{display:none;flex:none;width:24px;height:24px;margin-right:3px;border:0;border-radius:5px;background:none;color:var(--soluk);cursor:pointer;font-size:14px;line-height:1}
.agac-satir:hover .agac-uc{display:grid;place-items:center}.agac-satir:hover .ag-son{display:none}.agac-uc:hover{background:var(--yan-3);color:var(--yazi)}
.ca-kart{position:relative}.ca-uc{position:absolute;top:8px;right:8px;z-index:1;width:28px;height:28px;border-radius:7px;display:none;place-items:center;background:var(--kart);box-shadow:0 0 0 1px var(--kenar);color:var(--yazi-2);font-size:15px;line-height:1}
.ca-kart:hover .ca-uc{display:grid}.ca-uc:hover{color:var(--yazi);background:var(--yan)}
.cm-satir.tehlike,.cm-satir.tehlike .cm-ik{color:var(--tehlike)}
.agac-git .ag-son{margin-left:auto;padding-left:8px;font-size:11.5px;color:var(--soluk-2);white-space:nowrap;flex:none}
.nabiz{width:7px;height:7px;border-radius:50%;background:var(--karar);flex:none;box-shadow:0 0 0 3px var(--karar-zemin);animation:ikonNabiz 1.2s ease-in-out infinite}
.nabiz.sari{background:var(--soru);box-shadow:0 0 0 3px var(--soru-zemin)}.nabiz.mor{background:var(--r-mor);box-shadow:0 0 0 3px var(--r-mor-z)}
.ray-nabiz{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--karar);box-shadow:0 0 0 2px var(--yan-2);animation:ikonNabiz 1.2s ease-in-out infinite}
.ly-canli{margin-top:auto;border-top:1px solid var(--kenar);padding:10px 0 0;display:flex;flex-direction:column;gap:2px}
.ly-canli:empty{display:none}
.ly-canli b{font-size:11.5px;font-weight:500;color:var(--soluk);padding:0 8px 4px}
.lc{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border:0;border-radius:6px;background:none;font-size:12.5px;color:var(--yazi-2);text-align:left}
button.lc{cursor:pointer}button.lc:hover{background:var(--yan-2)}
.lc span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lc small{color:var(--soluk)}
/* Codex ikonu çizerken: rayda ve listede yavaş nabız */
@keyframes ikonNabiz{0%,100%{opacity:1}50%{opacity:.35}}
.ray-kare.ciziliyor,.agac-satir.ciziliyor .av,.agac-satir.ciziliyor .renk-kare,.sy-ikon.ciziliyor{animation:ikonNabiz 1.2s ease-in-out infinite}
.ly-ikon{border:0;background:none;padding:4px;margin-right:-6px;border-radius:6px;cursor:pointer;display:grid;place-items:center}.ly-ikon:hover{background:var(--kenar-2)}
.ks-renk{display:flex;gap:4px;flex-wrap:wrap;padding:0 2px}
.ks-renk button{width:25px;height:25px;border-radius:6px;border:0;font-size:11px;font-weight:700;cursor:pointer}
.ks-renk button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--kart),0 0 0 3.5px currentColor}
.ks-alt{display:flex;justify-content:space-between;border-top:1px solid var(--kenar);padding-top:6px}
.ks-alt button{height:26px;padding:0 6px;border:0;border-radius:5px;background:none;color:var(--soluk);font-size:12.5px;cursor:pointer}
.ks-alt button:hover{background:var(--yan-2);color:var(--yazi)}
.ks-alt .tehlike:hover,.sy-acilir .tehlike:hover{color:var(--tehlike)}
/* Alt sayfa oku Notion gibi: ikonun yerinde, yalnız satırın üstüne gelince */
.agac-git{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border:0;background:none;cursor:pointer;text-align:left;font-size:14px;color:var(--yazi-2)}
.agac-git svg{width:16px;height:16px;flex-shrink:0;color:var(--soluk)}
.agac-git span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agac-git .harf{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;flex-shrink:0;background:var(--yan-3);color:var(--yazi-2);font-size:11px;font-weight:600}
.agac-git .kilit{display:grid;margin-left:auto;color:var(--soluk-2)}.agac-git .kilit svg{width:12px;height:12px}
.agac-git small{margin-left:auto;font-size:11px;color:var(--soluk-2)}
.agac-git.basliksiz span{color:var(--soluk)}
.agac-satir[aria-current="true"] .agac-git{color:var(--yazi);font-weight:500}
.sy-yuzey{display:flex;flex-direction:column;background:var(--kart)}
.sy-sekmeler{display:flex;gap:2px;padding:2px;border-radius:7px;background:var(--yan)}
.sy-sekme{height:24px;padding:0 10px;border:0;border-radius:5px;background:none;color:var(--soluk);font-size:13px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.sy-sekme:hover{color:var(--yazi)}
.sy-sekme[aria-selected="true"]{background:var(--kart);color:var(--yazi);box-shadow:0 1px 2px rgba(55,53,47,.12)}
.sy-sekme svg{width:13px;height:13px}
.sy-sayac{font:11px 'Geist Mono',monospace;color:var(--soluk-2)}
.sy-uc{width:28px;padding:0;justify-content:center;font-size:16px;letter-spacing:1px}
.sy-uc-kap{position:relative}
.sy-acilir{position:absolute;right:0;top:calc(100% + 6px);width:230px;background:var(--kart);border:1px solid var(--kenar);border-radius:var(--kat-kose);box-shadow:var(--kat-golge);padding:5px;z-index:25;display:flex;flex-direction:column}
.sy-acilir{width:256px;padding:6px;gap:1px}
.sy-acilir button{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;font-size:13.5px;color:var(--yazi)}
.sy-acilir button:hover{background:var(--yan-2)}
.sy-acilir button>i{width:16px;height:16px;display:grid;place-items:center;flex-shrink:0;color:var(--soluk);font-style:normal}
.sy-acilir button>i svg{width:15px;height:15px}
.sy-acilir button small{margin-left:auto;font-size:12px;color:var(--soluk-2)}
.sy-acilir kbd{margin-left:auto;font:11px 'Geist Mono',monospace;color:var(--soluk-2)}
.sy-acilir button.soluk-eylem{height:auto;min-height:30px;padding:5px 10px;color:var(--soluk)}.sy-acilir button.soluk-eylem>span{display:flex;flex-direction:column}
.sy-acilir button.soluk-eylem small{margin:1px 0 0;font-size:11.5px;color:var(--soluk-2)}.sy-acilir button.soluk-eylem:hover{color:var(--tehlike)}
.sy-acilir-bas{font-size:11.5px;font-weight:500;color:var(--soluk);padding:6px 10px 3px}
.sy-acilir-ayrac{height:1px;background:var(--kenar);margin:5px 4px}
.sy-acilir .tehlike,.sy-acilir .tehlike>i{color:var(--tehlike)}
.anahtar{margin-left:auto;width:26px;height:15px;border-radius:999px;background:var(--kenar-3);position:relative;transition:background .15s;flex-shrink:0}
.anahtar::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--kart);transition:transform .15s}
[aria-checked="true"] .anahtar{background:var(--karar)}[aria-checked="true"] .anahtar::after{transform:translateX(11px)}
.sy-acilir-yol{padding:6px 10px 3px;font:11px 'Geist Mono',monospace;color:var(--soluk-2);cursor:copy;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:5px}
.sy-acilir-yol:hover{color:var(--yazi-2)}
.sy-tehlike{color:var(--tehlike)}
.sy-kaydir{flex:1;overflow:auto;position:relative;min-height:0}
.sy-tuval{flex:1;position:relative;min-height:0;background:var(--yan)}
.sy-cizim-bos{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(340px,90%);padding:22px 20px;border-radius:8px;background:var(--kart);border:1px solid var(--kenar);box-shadow:0 8px 28px -14px rgba(55,53,47,.25);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:5;font-size:13px;color:var(--soluk);line-height:1.55;pointer-events:none}
.sy-cizim-bos b{color:var(--yazi);font-size:15px;font-weight:600}
.sy-cizim-bos .ana-dugme{pointer-events:auto;margin-top:6px;display:inline-flex;align-items:center;gap:7px}
.sy-cizim-bos .ana-dugme svg{width:14px;height:14px}
.sy{max-width:740px;margin:0 auto;padding:76px 64px 32vh;position:relative}
.sy-baslik{font-size:40px;font-weight:700;line-height:1.2;letter-spacing:-.025em;outline:none;margin:0 0 18px;word-break:break-word;color:var(--yazi)}
.sy-baslik:empty::before{content:attr(data-ph);color:var(--kenar-3)}
/* Boş sayfada şablon satırı: yazmaya başlayınca kaybolur */
.sy-blok{position:relative;display:flex;align-items:flex-start;margin:1px 0;padding:2px 0;border-radius:4px}
.sy-tutamak{position:absolute;left:-50px;top:3px;display:flex;gap:1px;opacity:0;transition:opacity .12s}
.sy-blok:hover .sy-tutamak{opacity:1}
.sy-tutamak button{width:23px;height:24px;border:0;border-radius:5px;background:none;color:var(--soluk-2);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;padding:0}
.sy-tutamak button:hover{background:var(--yan-2);color:var(--yazi-2)}
.sy-tut{font-size:10px!important;letter-spacing:-2px;cursor:grab!important;touch-action:none}
/* Blok sürükleme: taşınan blok soluk, imleçte yarı saydam kopyası, bırakılacak yerde mavi çizgi */
.sy.surukleniyor,.sy.surukleniyor *{cursor:grabbing!important;user-select:none}
.sy-blok.suruklenen{opacity:.35}
.sy-hayalet{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:.75;background:var(--kart);border-radius:4px;box-shadow:0 8px 24px -10px rgba(55,53,47,.35)}
.sy-hayalet .sy-tutamak{display:none}
.sy-birak{position:absolute;height:3px;margin-top:-1px;border-radius:2px;background:var(--karar);opacity:.75;pointer-events:none;z-index:20}
.sy-metin{flex:1;min-width:0;outline:none;font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--yazi)}
.sy-metin:empty:focus::before{color:var(--soluk-2);pointer-events:none}
.sy-blok[data-tur="p"] .sy-metin:empty:focus::before{content:"Yazmaya başla ya da / ile blok seç"}
.sy-blok[data-tur="h1"]{margin-top:30px}.sy-blok[data-tur="h1"] .sy-metin{font-size:30px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.sy-blok[data-tur="h2"]{margin-top:22px}.sy-blok[data-tur="h2"] .sy-metin{font-size:23px;font-weight:650;line-height:1.35;letter-spacing:-.015em}
.sy-blok[data-tur="h3"]{margin-top:16px}.sy-blok[data-tur="h3"] .sy-metin{font-size:19px;font-weight:600;line-height:1.4}
.sy-blok[data-tur="h1"] .sy-tutamak{top:9px}.sy-blok[data-tur="h2"] .sy-tutamak{top:6px}.sy-blok[data-tur="h3"] .sy-tutamak{top:4px}
.sy-blok[data-tur="h1"] .sy-metin:empty::before{content:"Başlık 1";color:var(--kenar-3)}
.sy-blok[data-tur="h2"] .sy-metin:empty::before{content:"Başlık 2";color:var(--kenar-3)}
.sy-blok[data-tur="h3"] .sy-metin:empty::before{content:"Başlık 3";color:var(--kenar-3)}
.sy-blok[data-tur="ul"]::before{content:"•";width:24px;text-align:center;font-size:22px;line-height:1.2;flex-shrink:0;color:var(--yazi)}

.bl-bolum{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--kart);box-shadow:0 0 0 1px var(--kenar)}

.bl-ajan[hidden]{display:none}

.sy-ai{position:absolute;left:64px;right:64px;z-index:6;background:var(--kart);border:1px solid var(--kenar);border-radius:10px;box-shadow:0 12px 32px -16px rgba(55,53,47,.3);padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;animation:aiGel .18s ease-out}
