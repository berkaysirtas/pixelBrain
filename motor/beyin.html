// Ağ ve ayrıntısı: ortak beyinde hepsi, çalışma alanında yalnız o (izole)
function agKur(kap, ayrinti, veri, secenek) {
  const ag = BeyinAg.hazirla(veri, secenek);
  const say = (f) => ag.dugum.filter(f).length;
  // Açıklama ağın gerçek renkleriyle (ag.js › renk): alan, Defter bölümü ve not çalışma alanının rengini alır; boş satır yazılmaz
  const satir = (renk, ad, n, cizgi) => n ? `<div><i style="background:${renk}${cizgi ? ';box-shadow:inset 0 0 0 1px ' + cizgi : ''}"></i>${kacis(ad)}<span>${n}</span></div>` : '';
  const lejant = `<div class="lejant">${veri.calisma.calisma_alanlari.map((ca) => satir(`var(--r-${ca.renk || 'gri'})`, ca.ad, say((d) => d.ca === ca.id && /^(alan|bolum|not)$/.test(d.tur)))).join('')}
    ${satir('var(--yazi-2)', 'Bilgi', say((d) => d.tur === 'bilgi'))}${satir('var(--kenar-3)', 'Pano', say((d) => d.tur === 'pano'))}
    ${satir('var(--kaynak-zemin)', 'Veri', say((d) => d.tur === 'veri'), 'var(--kaynak)')}${satir('var(--claude)', 'Konuşma', say((d) => d.tur === 'konusma'))}${satir('var(--soluk-2)', 'Konu', say((d) => d.tur === 'konu'))}</div>`;
  const bos = secenek.onizleme ? '' : `${lejant}<div class="ipucu">Tıkla: ayrıntı. Çift tıkla: aç. Sürükle, tekerlekle yakınlaş.</div>`;
  ayrinti.innerHTML = bos; if (secenek.onizleme) ayrinti.hidden = true;
  return BeyinAg.ciz(kap, ag, { dogrulama: !!secenek.dogrulama, kenar: secenek.kenar, ac() { ayrinti.querySelector('[data-git]')?.click(); }, sec(d, bag) {
    if (!d) { ayrinti.innerHTML = bos; if (secenek.onizleme) ayrinti.hidden = true; return; }
    const caId = d.ca || (d.alan && alanCalismasi(d.alan)?.id);
    let tur = '', bas = kacis(d.ad), ek = '', git = '', gitAd = '';
    if (d.tur === 'not') {
      const n = d.not, p = veri.panolar[n.pano];
      tur = (TUR_AD[n.tur] || 'NOT') + ' · ' + kod(n.no) + (n.durum === 'vazgecildi' ? ' · vazgeçildi' : n.durum === 'acik' ? ' · açık' : '');
      const yol = `notlar/${n.alan}/${n.dosya}`;
      const kim = d.varsayim ? `<span class="ob-kim varsayim">${kacis(KIM[n.veren] || n.veren)} · onayını bekliyor<button type="button" class="ikincil" data-not-onay="${kacis(yol)}">Onayla</button></span>`
        : `<span class="ob-kim">${n.veren === 'kullanici' ? 'Senin sözün' : kacis(KIM[n.veren] || n.veren || '') + (n.onay ? ' · sen onayladın' : '')} · ${kacis(yol)}</span>`;
      ek = (sozu(n.govde) ? `<span class="soz">${kacis(sozu(n.govde))}</span>` : '') + `<small style="color:var(--soluk)">${p ? kacis(p.title.split(' (')[0]) + (n.bolum ? ' › ' + kacis(n.bolum) : '') : ''}</small>` + kim;
      git = `#/c/${caId}/${n.alan}${n.pano ? '/' + n.pano : ''}`; gitAd = n.pano ? 'Tuvalde aç' : 'Alanı aç'; seciliNot = n.no;
    } else if (d.tur === 'konu') { tur = 'KONU · başlık Claude'; ek = `<small style="color:var(--soluk)">${kacis(d.ozet || '')}</small>`; git = `#/c/${caId}/${d.alan}`; gitAd = 'Alanı aç'; }
    else if (d.tur === 'pano') { tur = 'PANO'; git = `#/c/${caId}/${d.alan}/${d.pano}`; gitAd = 'Tuvalde aç'; }
    else if (d.tur === 'alan') {
      const c_ = caBul(d.ca), df = d.defter;
      tur = `${kacis(c_?.ad || '')} › ALAN${c_?.izole ? ' · izole' : ''}`; bas = (d.px ? `<span class="ip">${pxSvg(d.px, d.renkAdi, 18)}</span>` : '') + kacis(d.ad);
      ek = `<small style="color:var(--soluk)">${df ? (df.dolu ? `Defter: ${df.bolumler.length} bölüm, ${df.boy < 1000 ? df.boy + ' karakter' : Math.round(df.boy / 100) / 10 + ' bin karakter'}` : 'Defter boş') : 'Defter yok'}</small>`;
      git = `#/c/${d.ca}/${d.alan}/yazi`; gitAd = "Defter'i aç";
    } else if (d.tur === 'bolum') { tur = `DEFTER BÖLÜMÜ · ${kacis(alanBul(caId, d.alan)?.ad || d.alan)}`; git = `#/c/${caId}/${d.alan}/yazi`; gitAd = "Defter'de aç"; }
    else if (d.tur === 'bilgi') { tur = 'BİLGİ · ' + (d.bilgi.tur === 'preference' ? 'tercihin' : 'kalıcı öğrenim'); ek = `<small style="color:var(--soluk)">${kacis(d.bilgi.yol)} · ${d.bilgi.yollar.length} kaynak</small>`; }
    else if (d.tur === 'ca') { tur = 'ÇALIŞMA ALANI' + (caBul(d.ca)?.izole ? ' · izole' : ''); git = `#/c/${d.ca}`; gitAd = 'Çalışma alanını aç'; }
    else if (d.tur === 'konusma') { tur = 'KONUŞMA · ' + d.konusma.kaynak; bas = kacis(d.konusma.ilk || d.ad); ek = `<small style="color:var(--soluk)">${d.konusma.mesaj} mesaj, ${d.konusma.sen} senin</small><a href="/${kacis(d.konusma.yol)}" target="_blank">Kaydı aç ↗</a>`; }
    else if (d.tur === 'veri') { tur = 'VERİ'; ek = `<a href="/${kacis(d.veri.yol)}" target="_blank">Aç ↗</a>`; }
    if (d.bulgular) ek += d.bulgular.map((f) => `<span class="ob-bulgu"><b>${BULGU_AD[f.tur] || f.tur}</b>${kacis(f.ne)}${f.kaynak ? `<small>${kacis(f.kaynak)}</small>` : ''}</span>`).join('');
    ayrinti.innerHTML = `<div class="kutu"><span class="tur">${tur}</span><span class="bas">${bas}</span>${ek}<small style="color:var(--soluk)">${bag} bağ</small>${git ? `<button class="ikincil" type="button" data-git="${kacis(git)}" style="align-self:flex-start">${gitAd}</button>` : ''}</div>`;
    ayrinti.hidden = false;
  } });
}
const BULGU_AD = { celisen: 'Çelişen', eskiyen: 'Eskiyen', varsayim: 'Varsayım' };

function sekmeCiz(ad, secenekler, secili) {
  return `<div class="sekmeler" role="tablist">${secenekler.map(([id, yazi]) => `<button class="sekme" type="button" role="tab" data-sekme="${ad}:${id}" aria-selected="${id === secili}">${yazi}</button>`).join('')}</div>`;
}

async function ortakCiz() {
  const sekme = depo.al('sekme:ortak') || 'ag';
  if (sekme === 'ag') return ortakAgCiz();
  if (sekme === 'ben') {  // Ben (K-060): Ayarlar'dan çıktı; Codex seni buradan tanır
    $('#icerik').className = '';
    $('#icerik').innerHTML = `<div class="sayfa"><div class="sb"><span class="sb-ik">${pxSvg(BEN_PX, 'gri', 36)}</span><div class="sb-orta"><h1>Ben</h1>
      <p class="sb-meta">Codex seni buradan tanır. Yalnız sen yazarsın; her kart Core.md'nin bir bölümü.</p></div></div><div id="benKap" style="margin-top:26px"></div></div>`;
    return benCiz($('#benKap'));
  }
  const veri = await hepsiniAl();
  if (yerOku().tur !== 'ortak') return;
  $('#icerik').className = '';
  const ust = `<div class="baslik-satiri"><div><h1>Son eklenenler</h1></div></div>`;  // sekmeler üst çubukta
  if (sekme === 'ag') {
    $('#icerik').innerHTML = `<div class="sayfa genis">${ust}<div class="ag-satir"><div class="ag-kap" id="agKap"></div><div class="ayrinti" id="ayrinti"></div></div></div>`;
    return agKur($('#agKap'), $('#ayrinti'), veri, {});
  }
  const alanAdi = (id) => { const ca = alanCalismasi(id); return ca ? `${ca.ad} › ${ca.alanlar.find((a) => a.id === id).ad}` : id; };
  const son = veri.notlar.filter((n) => n.durum !== 'vazgecildi').sort((a, b) => (b.tarih || '').localeCompare(a.tarih || '') || Number(b.akis || 0) - Number(a.akis || 0)).slice(0, 12);
  const sonUst = `<div class="sb"><span class="sb-ik">${pxSvg(SON_PX, 'gri', 36)}</span><div class="sb-orta"><h1>Son eklenenler</h1><p class="sb-meta">${veri.notlar.length} not · ${veri.veriler.length} veri · ${veri.konusmalar.length} konuşma</p></div></div>`;
  $('#icerik').innerHTML = `<div class="sayfa">${sonUst}<div class="uc">
    <div class="liste"><h2>NOTLAR · ${veri.notlar.length}</h2>${son.map((n) => `<button class="satir" type="button" data-git="#/c/${alanCalismasi(n.alan)?.id}/${n.alan}${n.pano ? '/' + n.pano : ''}"><span class="pin" style="background:${RENK[n.tur] || 'var(--soluk)'}">${kod(n.no)}</span><div><span class="ust">${kacis(n.baslik)}</span><span class="yer">${kacis(alanAdi(n.alan))}</span></div></button>`).join('') || '<div class="satir"><small>Henüz not yok</small></div>'}</div>
    <div class="liste"><h2>VERİLER · ${veri.veriler.length}</h2>${veri.veriler.slice(0, 12).map(veriSatiri).join('') || '<div class="satir"><small>Henüz veri yok. Sağ üstteki + Veri ile ekle.</small></div>'}</div>
    <div class="liste"><h2>KONUŞMALAR · ${veri.konusmalar.length}</h2>${veri.konusmalar.slice(0, 12).map((k) => `<a class="satir" href="/${kacis(k.yol)}" target="_blank"><span class="ikon" style="background:var(--claude);color:var(--ters-yazi);border:0">${k.kaynak[0]}</span><div style="min-width:0"><span class="ust" style="color:var(--yazi)">${kacis(k.ilk || k.ad)}</span><small>${k.kaynak} · ${k.mesaj} mesaj · ${zamanYaz(k.zaman)}</small></div></a>`).join('') || '<div class="satir"><small>Henüz konuşma yok</small></div>'}</div>
  </div></div>`;
}

// Obsidian gibi ağ (K-080): tam ekran, her not, pano, Defter bölümü, bilgi notu ve veri bir nokta; bağlar gerçek atıflar
// (ag.js). Canlı kuvvet: sürükleyince esner, üstüne gelince komşular parlar, yakınlaştıkça adlar belirir. Çalışma alanı çipi
// ağı o alana süzer (izole çalışma alanı kendi adası olarak görünür), arama eşleşmeyenleri soldurur, sağda seçilenin kartı.
function obsidianAg(veri, agv, sag, dogrulama, saglikAcik, bekleyen) {
  const kumeler = veri.calisma.calisma_alanlari, odak = kumeler.some((c) => c.id === depo.al('ob:odak')) ? depo.al('ob:odak') : '';
  $('#icerik').className = 'ob-icerik'; document.body.classList.add('ortakta');
  $('#icerik').innerHTML = `<div class="ob ob-obs" id="obKap"><div class="ag-kap ob-ag" id="obAgKap"></div>
    <div class="ob-hap"><span class="ob-ara-ikon">${ARA_IKON}</span><input class="ob-ara" id="obAra" placeholder="Ağda ara…" autocomplete="off" spellcheck="false"><span class="ob-ayrac"></span>
      <button type="button" class="ob-cip notr" data-ob-suz="" aria-pressed="${!odak}">Hepsi</button>
      ${kumeler.map((c) => `<button type="button" class="ob-cip" data-ob-suz="${c.id}" aria-pressed="${odak === c.id}" style="--r:var(--r-${renkOf(c)})"><i></i>${kacis(c.ad)}${c.izole ? `<span class="ob-izole" title="İzole: kendi adası">${KILIT_IKON}</span>` : ''}</button>`).join('')}
      <span class="ob-ayrac"></span><button type="button" class="ob-cip notr" data-ob-dogrulama aria-pressed="${dogrulama}">Doğrulama</button></div>
    <aside class="ob-kart ayrinti" id="obAyrinti"></aside>
    ${kumeler.some((c) => c.alanlar.length) ? '' : `<div class="ob-bos"><b>Henüz bir şey yok</b><p>Raydaki + ile bir çalışma alanı aç, içine bir alan aç ve yaz; ağ burada büyür.</p><button type="button" data-ob-ogren>Beyin'i öğren</button></div>`}
    ${dogrulama && sag ? `<button type="button" class="ob-rozet${bekleyen ? ' var' : ''}" data-ob-saglik aria-expanded="${saglikAcik}" title="Beyin sağlığı"><i></i>${sag.tarama?.calisiyor ? 'Taranıyor' : bekleyen ? bekleyen + ' bekleyen' : 'Sağlıklı'}</button>` : ''}
    ${dogrulama && sag && saglikAcik ? `<div class="ob-saglik" id="obSaglik">${saglikHtml(sag, veri)}</div>` : ''}</div>`;
  obAg = agKur($('#obAgKap'), $('#obAyrinti'), { ...veri, defterler: agv.defterler || [], bilgi: agv.bilgi || [] },
    { ca: odak || undefined, dogrulama, kenar: { u: 64, s: 340, a: 16, l: 16 } });
  $('#obAra').addEventListener('input', (e) => e.target.classList.toggle('yok', obAg?.ara(e.target.value) === 0));
  $('#obAra').addEventListener('keydown', (e) => { if (e.key === 'Enter') obAg?.git(); });  // Enter: ilk eşleşmeye git
  $('#obKap').addEventListener('click', (e) => {
    if (e.target.closest('[data-ob-ogren]')) return void window.ogreticiKur?.().catch(() => {});
    const b = e.target.closest('[data-ob-suz]');
    if (b) { depo.koy('ob:odak', b.dataset.obSuz); ortakAgCiz(); }
  });
}

function veriSatiri(v) {
  const ca = caBul(v.calisma);
  const nerede = ca ? ca.ad + (v.alan ? ' › ' + (alanBul(v.calisma, v.alan)?.ad || v.alan) : '') : 'genel';
  return `<a class="satir" href="/${kacis(v.yol)}" target="_blank"><span class="ikon">${v.ad.endsWith('.url.txt') ? '↗' : v.ad.endsWith('.md') ? '¶' : '▤'}</span><div style="min-width:0"><span class="ust" style="color:var(--yazi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${kacis(v.ad.replace(/^\d{8}-\d{6}-/, ''))}</span><small>${kacis(nerede)} · ${zamanYaz(v.zaman)}</small></div></a>`;
}

// Ortak beyin (K-046): çalışma alanları küme küme; seçili küme parlak, diğerleri soluk, zemin noktalı. Merkezde çalışma alanı,
// çevresinde alanlar (pixel ikonlu halka); alanın yanında bilgi (◆) ve not (•) hapları; sağ üstte seçilenin kartı.
// Sürükle: kaydır; tekerlek ve iki parmak: yakınlaştır. Doğrulama açıkken beyin sağlığı ve Codex taraması.
let obAg = null, taramaSaat = null;
const katla = (m) => sade(String(m)), kisalt = (m, n) => (m.length > n ? m.slice(0, n - 1).trimEnd() + '…' : m);
async function ortakAgCiz() {
  const [veri, agv, sag] = await Promise.all([hepsiniAl(), al('/api/ag'), al('/api/saglik').catch(() => null)]);

    let s; try { s = await gonder('/api/dogrula', govde); } catch (h) { d.disabled = false; return bildir(h.message); }
    const hafiza = s.yazilan.some((y) => y.startsWith('knowledge/')), bilgi = s.yazilan.some((y) => y.startsWith('sayfalar/'));
    if (s.yazilan.length) bildir(hafiza && bilgi ? "Bilgi'ye ve hafızaya yazıldı" : hafiza ? 'Hafızaya yazıldı' : "Bilgi'ye yazıldı"); else if (karar === 'hayir') bildir('Yazılmadı; bir daha sorulmaz');

// Ben: Codex'in seni tanıdığı katman (ben/). Kendin hakkında ve kurallar senin; öğrenilenleri Codex ekler, sen reddedersin.
// Ayarlar › Ben: Core.md'nin her "# " bölümü ayrı kart (Kimim, Ne iş yapıyorum, Ürünler…), yanında Kurallar ve Codex'in öğrendikleri.
// Kart yazıldıkça Core.md bölüm sırası korunarak yeniden kurulur; dosya tek kaynak.
const coreBolumleri = (metin) => {
  const b = [{ baslik: '', satir: [] }];
  for (const l of String(metin || '').split('\n')) { const m = /^#\s+(.+)$/.exec(l); if (m) b.push({ baslik: m[1].trim(), satir: [] }); else b[b.length - 1].satir.push(l); }
  return b.map((x) => ({ baslik: x.baslik, govde: x.satir.join('\n').trim() })).filter((x, i) => x.baslik || x.govde || i === 0 && b.length === 1);
};
const guzelBaslik = (b) => { const k = b.toLocaleLowerCase('tr'); return k ? k.charAt(0).toLocaleUpperCase('tr') + k.slice(1) : 'Kendin hakkında'; };
async function benCiz(kap) {
  const b = await al('/api/ben');
  if (!kap.isConnected) return;
  const bolumler = coreBolumleri(b.core);
  const madde = (m, red) => `<div class="ben-madde${red ? ' soluk' : ''}"><span>${kacis(m.metin)}<small>${kacis(m.tarih)}${red ? ' · red: ' + kacis(m.neden) : ''}</small></span><button type="button" class="ikincil" ${red ? `data-geri="${kacis(m.id)}">Geri al` : `data-reddet="${kacis(m.id)}">Reddet`}</button></div>`;
  kap.innerHTML = `<div class="ben-izgara">${bolumler.map((x, i) => `<section class="ben-kart ben-bolum"><div class="ben-bas"><b>${kacis(guzelBaslik(x.baslik))}</b><small data-durum="core-${i}"></small></div>
      <textarea class="ben-yaz" data-bolum="${i}" placeholder="Yaz…">${kacis(x.govde)}</textarea></section>`).join('')}</div>
    <div class="ben-duzen">
      <section class="ben-kart"><div class="ben-bas" title='Düzeltmeler; "bunu yapma" dediğinde Codex de ekler.'><b>Kurallar</b><small data-durum="kurallar"></small></div>
        <textarea class="ben-yaz" data-ben="kurallar">${kacis(b.kurallar)}</textarea></section>
      <section class="ben-kart ben-sag"><div class="ben-bas" title="Codex konuşurken ekler. Yanlışsa reddet, bir daha bağlama girmez."><b>Codex'in öğrendikleri</b><small>${b.ogrenilen.length}</small></div>
        <div class="ben-liste">${b.ogrenilen.map((m) => madde(m)).join('') || '<small style="color:var(--soluk)">Henüz yok; konuştukça birikir.</small>'}</div>
        ${b.reddedilen.length ? `<details class="ben-red"><summary>Reddedilen · ${b.reddedilen.length}</summary><div class="ben-liste">${b.reddedilen.map((m) => madde(m, true)).join('')}</div></details>` : ''}
      </section></div>`;
  const coreMetni = () => bolumler.map((x, i) => {
    const t = kap.querySelector(`[data-bolum="${i}"]`); const g = t ? t.value.trim() : x.govde;
    return (x.baslik ? `# ${x.baslik}\n` : '') + g;
  }).join('\n\n');
  kap.querySelectorAll('.ben-yaz').forEach((t) => {
    const uzat = () => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
    uzat(); t.addEventListener('input', uzat);
    const durum = t.dataset.ben || 'core-' + t.dataset.bolum;
    const yaz = (m) => { const d = kap.querySelector(`[data-durum="${durum}"]`); if (d) d.textContent = m; };
    let saat = null, son = t.value;
    const kaydet = async () => {
      clearTimeout(saat);
      if (t.value === son) return;
      const istek = t.dataset.ben ? { ad: t.dataset.ben, metin: t.value } : { ad: 'core', metin: coreMetni() };
      try { await gonder('/api/ben', istek); son = t.value; yaz('Kaydedildi'); } catch (e) { yaz('Kaydedilemedi'); bildir(e.message); }
    };
    t.addEventListener('input', () => { yaz('Yazılıyor…'); clearTimeout(saat); saat = setTimeout(kaydet, 700); });
    t.addEventListener('blur', kaydet);
  });
  kap.querySelector('.ben-sag').onclick = async (e) => {
    const r = e.target.closest('[data-reddet]'), g = e.target.closest('[data-geri]');
    if (!r && !g) return;
    try { await gonder('/api/ben', r ? { reddet: r.dataset.reddet } : { geriAl: g.dataset.geri }); bildir(r ? 'Reddedildi: bir daha bağlama girmez' : 'Geri alındı'); benCiz(kap); }
    catch (er) { bildir(er.message); }
  };
}

function surukleSirala(e, tut, secici, bitti) {
  const satir = tut.closest(secici), kap = satir.parentElement, y0 = e.clientY;
  e.preventDefault(); satir.classList.add('suruklenen');
  const hareket = (ev) => { satir.style.transform = `translateY(${ev.clientY - y0}px)`; };
  const birak = (ev) => {
    removeEventListener('pointermove', hareket); removeEventListener('pointerup', birak);
    satir.style.transform = ''; satir.classList.remove('suruklenen');
    const digerleri = [...kap.querySelectorAll(':scope > ' + secici)].filter((x) => x !== satir);
    const once = digerleri.find((x) => { const r = x.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
    once ? kap.insertBefore(satir, once) : digerleri.length && digerleri[digerleri.length - 1].after(satir);
    bitti([...kap.querySelectorAll(':scope > ' + secici)]);
  };
  addEventListener('pointermove', hareket); addEventListener('pointerup', birak);
}

// Her blok .bl-blok[data-i] kalır: "Defter'e al" ve Codex'in yeni yazdığı bloğun vurgusu buna bağlı.

    return `\u0001${tok.length - 1}\u0001`;

  return SayfaDuzenleyici.satirIci(ham)
    .replace(/<a href="(https?:[^"]+)"[^>]*>([^<]*)<\/a>/g, (t, u, ad) => `<a class="bl-cip" href="${u}" target="_blank" rel="noopener">${BL_LINK}${ad === u ? kacis(u.replace(/^https?:\/\/(www\.)?/, '').split('/')[0]) : ad}</a>`)

function komutCiz() {
  const q = sade($('#komutAra').value.trim());
  komutBulunan = (q ? komutTum.filter((o) => sade(o.ad + ' ' + (o.ek || '')).includes(q)).sort((a, b) => sade(b.ad).startsWith(q) - sade(a.ad).startsWith(q)) : komutTum.filter((o) => !o.pano)).slice(0, 50);
  komutImlec = 0;
  $('#komutSonuc').innerHTML = komutBulunan.map((o, i) => `<button type="button" role="option" data-komut="${i}" aria-selected="${i === 0}">${o.ik}<span>${kacis(o.ad)}</span><small>${o.ek ? kacis(o.ek) + ' · ' : ''}${o.tur}</small></button>`).join('')
    || '<div class="komut-bos">Bulunamadı</div>';
}
function komutImle(i) {
  komutImlec = Math.max(0, Math.min(i, komutBulunan.length - 1));
  $('#komutSonuc').querySelectorAll('[data-komut]').forEach((b, j) => b.setAttribute('aria-selected', String(j === komutImlec)));
  $('#komutSonuc').querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
}
function komutGit(i) { const o = komutBulunan[i]; komutKapat(); if (o?.eylem) o.eylem(); else if (o) location.hash = o.git; }
function komutKapat() { $('#komut').hidden = true; }
$('#komutAra').addEventListener('input', komutCiz);
$('#komutAra').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); komutImle(komutImlec + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); komutImle(komutImlec - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); komutGit(komutImlec); }
  else if (e.key === 'Escape') { e.preventDefault(); komutKapat(); }
});
$('#komut').addEventListener('click', (e) => { const b = e.target.closest('[data-komut]'); if (b) komutGit(+b.dataset.komut); else if (!e.target.closest('.komut-kutu')) komutKapat(); });
// Tuvaldeki hızlı eylem (K-038 adım 3): sohbette kısa ad görünür, istemi sunucu <pano_eylemi> olarak kurar
const EYLEM_AD = { genislet: 'Genişlet', dogrula: 'Doğrula', kumele: 'Kümele', birlestir: 'Birleştir', karsilastir: 'Karşılaştır' };
function panoEylemi(d) {
  const ad = d.eylem === 'revize' ? (d.istek ? 'Revize et: ' + d.istek : 'Baştan çiz') : EYLEM_AD[d.eylem];
  if (!ad || !d.panolar?.length) return;
  codexSekmesi();
  CodexPanel.yaz(ad, d.eylem !== 'dogrula', { baglam: { panolar: d.panolar, baslik: d.baslik }, eylem: { ad: d.eylem, istek: d.istek || '', yer: d.yer } });
}
// Tuvalden gelen: V, sürükleme, bırakılan dosyalar (aynı köken)
addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data?.beyin) return;
  if (e.data.beyin === 'veri') veriAc($('#veri').hidden);
  if (e.data.beyin === 'panel') panelAc(panelKapali());
  if (e.data.beyin === 'surukle') $('#birak').hidden = !e.data.acik;
  if (e.data.beyin === 'dosya') { $('#birak').hidden = true; if (e.data.dosyalar?.length) dosyaEkle(e.data.dosyalar).catch((er) => bildir(er.message)); }
  if (e.data.beyin === 'codex') { codexSekmesi(); CodexPanel.baglam({ panolar: e.data.panolar || [], bolge: e.data.bolge || null, baslik: e.data.baslik }); }
  if (e.data.beyin === 'eylem') panoEylemi(e.data);
  if (e.data.beyin === 'ara') komutAc();
  if (e.data.beyin === 'tuvalDegisti') cizimSay();
  if (e.data.beyin === 'cizim') { codexSekmesi(); CodexPanel.cizim(e.data.acik); }
  if (e.data.beyin === 'merhaba' && sonHal) tuvaleHal(sonHal);
  if (e.data.beyin === 'merhaba') sayfaKartlariYolla();
  if (e.data.beyin === 'sekme' && acikNot && ['yazi', 'bilgi'].includes(e.data.sekme)) location.hash = `#/c/${acikNot.ca.id}/${acikNot.a.id}/${e.data.sekme}`;
});

addEventListener('hashchange', ciz);
al('/api/surum').then((s) => { surumSon = s; surumRozet(); }).catch(() => {});  // sunucu günde bir kez GitHub'a sorar
if (!location.hash) location.hash = depo.al('yer') || '#/ortak';
ciz();
</script>
